# Read the Docs build. The real project + lockfile live in overlay/, so we install the docs
# dependency-group with uv (asdf-provided) exported from that lock — reproducible, no pip resolution.
# Pattern adapted from wemake-services/django-modern-rest.
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - cd overlay && uv export --only-group docs --no-emit-project --format=requirements.txt --output-file=../requirements.txt

python:
  install:
    - requirements: requirements.txt

mkdocs:
  configuration: mkdocs.yml
