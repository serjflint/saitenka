# Publishes the optional `taffylite` Rust extension (layout-engine extra, #146) to PyPI on a
# `taffylite-v*` tag; workflow_dispatch does a TestPyPI dry-run. Trusted Publishing (OIDC, no tokens),
# keyed to this filename — renaming needs the publisher re-registered on PyPI + TestPyPI.
#
# Three wheels per platform (pyo3 abi3 + abi3t, PEP 803): abi3 via 3.13 (covers GIL 3.13+), cp314t via
# 3.14t (free-threaded 3.14, predates abi3t), abi3t via 3.15t (covers FT *and* GIL 3.15+). One
# interpreter per job (never --find-interpreter): each job emits one wheel with a unique filename, so
# download-artifact's merge can't concatenate same-named wheels into a ZIP Warehouse rejects
# (CVE-2025-54368). 3.15t is still prerelease → its leg is non-fatal until the interpreter is installable.
name: taffylite release

on:
  push:
    tags: ["taffylite-v*"]
  workflow_dispatch: # manual TestPyPI dry-run of the current commit

permissions:
  contents: read

jobs:
  linux:
    name: wheel (linux ${{ matrix.arch }} ${{ matrix.py }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.py == '3.15t' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        py: ["3.13", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: taffylite
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: 2_28
          args: --release --locked --out dist --compatibility pypi -i python${{ matrix.py }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.py }}
          path: taffylite/dist

  macos:
    name: wheel (macos ${{ matrix.py }}) # arm64 only; Intel dropped (retired runner pool, pure-Python fallback)
    runs-on: macos-14
    continue-on-error: ${{ matrix.py == '3.15t' }}
    strategy:
      fail-fast: false
      matrix:
        py: ["3.13", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.py }}
          allow-prereleases: true
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: taffylite
          target: aarch64-apple-darwin
          args: --release --locked --out dist -i python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.py }}
          path: taffylite/dist

  windows:
    name: wheel (windows ${{ matrix.py }})
    runs-on: windows-latest
    continue-on-error: ${{ matrix.py == '3.15t' }}
    strategy:
      fail-fast: false
      matrix:
        py: ["3.13", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.py }}
          allow-prereleases: true
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: taffylite
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist -i python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.py }}
          path: taffylite/dist

  sdist:
    name: sdist (Corresponding Source / fallback build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: taffylite
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: taffylite/dist

  testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: [linux, macos, windows, sdist]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/taffylite
    permissions:
      id-token: write
    steps:
      # Checkout before download-artifact (its clean pass would wipe the downloads); the normalize
      # script lives in the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist-pypi
          merge-multiple: true
      # Defense-in-depth against CVE-2025-54368 strict-ZIP 400s (the one-interpreter-per-job build is the
      # real cure; this guards regressions).
      - name: Normalize wheels (strip trailing ZIP data)
        run: python3 taffylite/tools/normalize_wheels.py dist-pypi
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pypi/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/taffylite-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/taffylite
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist-pypi
          merge-multiple: true
      - name: Normalize wheels (strip trailing ZIP data)
        run: python3 taffylite/tools/normalize_wheels.py dist-pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pypi/
          skip-existing: true
