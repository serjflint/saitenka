name: libasslite bundle release

on:
  push:
    tags: ["libasslite-bundle-v*"]
  pull_request:
    paths:
      - ".github/workflows/libasslite-bundle-release.yml"
      - "libasslite-bundle/**"
      - "libasslite/**"
      - "tools/prepare_libass_bundle.py"
      - "tools/collect_vcpkg_sources.py"
      - "tools/smoke_libasslite_bundle.py"
      - "tools/verify_bundle_uninstall.py"
      - "tools/verify_macos_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_REF: 94a541197763a4f449a1b91478df48c0584a6256
  SOURCE_DATE_EPOCH: "1759752000"

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
      - name: Verify package version
        if: startsWith(github.ref, 'refs/tags/libasslite-bundle-v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          uv run --no-project python -c 'import os,tomllib,pathlib;
          expected=os.environ["RELEASE_VERSION"].removeprefix("libasslite-bundle-v");
          actual=tomllib.loads(pathlib.Path("libasslite-bundle/pyproject.toml").read_text())["project"]["version"];
          assert actual == expected, (actual, expected)'

  build:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-latest, triplet: x64-linux-dynamic, tag: manylinux_2_28_x86_64, repair: auditwheel, image: "quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b"}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, triplet: arm64-linux-dynamic, tag: manylinux_2_28_aarch64, repair: auditwheel, image: "quay.io/pypa/manylinux_2_28_aarch64@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99"}
          - {name: macos-arm64, runner: macos-14, triplet: arm64-osx-saitenka, tag: macosx_11_0_arm64, repair: delocate, target: "11.0"}
          - {name: windows-x86_64, runner: windows-latest, triplet: x64-windows, tag: win_amd64, repair: delvewheel}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: .vcpkg
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
      - name: Bootstrap and install native closure (POSIX)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          .vcpkg/bootstrap-vcpkg.sh -disableMetrics
          .vcpkg/vcpkg install --only-downloads --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --overlay-triplets=libasslite-bundle/triplets --triplet=${{ matrix.triplet }} --x-install-root="$RUNNER_TEMP/vcpkg-installed"
          .vcpkg/vcpkg install --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --overlay-triplets=libasslite-bundle/triplets --triplet=${{ matrix.triplet }} --x-install-root="$RUNNER_TEMP/vcpkg-installed"
      - name: Bootstrap and install native closure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .vcpkg/bootstrap-vcpkg.bat -disableMetrics
          .vcpkg/vcpkg.exe install --only-downloads --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --triplet=${{ matrix.triplet }} --x-install-root="$env:RUNNER_TEMP/vcpkg-installed"
          .vcpkg/vcpkg.exe install --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --triplet=${{ matrix.triplet }} --x-install-root="$env:RUNNER_TEMP/vcpkg-installed"
      - name: Build and repair inside pinned manylinux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm \
            -e SOURCE_DATE_EPOCH \
            -e LIBASSLITE_BUNDLE_WHEEL_TAG=py3-none-${{ matrix.tag }} \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /work \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              dnf install -y git zip unzip tar pkgconfig autoconf autoconf-archive automake libtool nasm
              /opt/python/cp313-cp313/bin/python -m pip install uv==0.12.0
              UV=/opt/python/cp313-cp313/bin/uv
              .vcpkg/bootstrap-vcpkg.sh -disableMetrics
              .vcpkg/vcpkg install --only-downloads --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --triplet=${{ matrix.triplet }} --x-install-root=/runner-temp/vcpkg-installed
              .vcpkg/vcpkg install --x-manifest-root=libasslite-bundle --overlay-ports=libasslite-bundle/ports --triplet=${{ matrix.triplet }} --x-install-root=/runner-temp/vcpkg-installed
              "$UV" run --no-project tools/prepare_libass_bundle.py --install-root /runner-temp/vcpkg-installed --triplet ${{ matrix.triplet }} --package libasslite-bundle
              "$UV" run --no-project tools/collect_vcpkg_sources.py --vcpkg-root .vcpkg --package libasslite-bundle --triplet ${{ matrix.triplet }} --output corresponding-source-${{ matrix.name }}.tar.gz
              "$UV" build --wheel --out-dir dist-a libasslite-bundle
              "$UV" build --wheel --out-dir dist-b libasslite-bundle
              cmp dist-a/*.whl dist-b/*.whl
              "$UV" tool run --from auditwheel==6.7.0 auditwheel repair --plat ${{ matrix.tag }} --wheel-dir repaired-a dist-a/*.whl
              "$UV" tool run --from auditwheel==6.7.0 auditwheel repair --plat ${{ matrix.tag }} --wheel-dir repaired-b dist-b/*.whl
              cmp repaired-a/*.whl repaired-b/*.whl
              "$UV" tool run --from auditwheel==6.7.0 auditwheel show repaired-a/*.whl
            '
      - name: Stage payload and dependency notices
        if: runner.os != 'Linux'
        shell: bash
        run: |
          uv run --no-project tools/prepare_libass_bundle.py --install-root "$RUNNER_TEMP/vcpkg-installed" --triplet ${{ matrix.triplet }} --package libasslite-bundle
          uv run --no-project tools/collect_vcpkg_sources.py --vcpkg-root .vcpkg --package libasslite-bundle --triplet ${{ matrix.triplet }} --output corresponding-source-${{ matrix.name }}.tar.gz
      - name: Build reproducibly and retag as a platform wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          export LIBASSLITE_BUNDLE_WHEEL_TAG=py3-none-${{ matrix.tag }}
          uv build --wheel --out-dir dist-a libasslite-bundle
          uv build --wheel --out-dir dist-b libasslite-bundle
          cmp dist-a/*.whl dist-b/*.whl
      - name: Repair macOS loader paths
        if: matrix.repair == 'delocate'
        shell: bash
        run: |
          uvx --from delocate==0.13.0 delocate-wheel -w repaired-a -v dist-a/*.whl
          uvx --from delocate==0.13.0 delocate-wheel -w repaired-b -v dist-b/*.whl
          uv run --no-project tools/verify_macos_bundle.py repaired-a/*.whl --target ${{ matrix.target }}
      - name: Repair Windows loader paths
        if: matrix.repair == 'delvewheel'
        shell: pwsh
        run: |
          uvx --from delvewheel==1.13.0 delvewheel repair --wheel-dir repaired-a (Get-ChildItem dist-a/*.whl).FullName
          uvx --from delvewheel==1.13.0 delvewheel repair --wheel-dir repaired-b (Get-ChildItem dist-b/*.whl).FullName
      - name: Verify repaired-wheel reproducibility
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cmp repaired-a/*.whl repaired-b/*.whl
          wheel=(repaired-a/*.whl)
          [[ "${wheel[0]}" == *-${{ matrix.tag }}.whl ]]
      - name: Build the paired libasslite wrapper
        shell: bash
        run: |
          uv python install 3.13
          uv run --python 3.13 --no-project --with maturin maturin build \
            --manifest-path libasslite/Cargo.toml --release --locked --out wrapper-dist -i python
      - name: Smoke bundle discovery and native ABI
        shell: bash
        run: |
          wheel=("$GITHUB_WORKSPACE"/repaired-a/*.whl)
          wrapper=("$GITHUB_WORKSPACE"/wrapper-dist/*.whl)
          venv="$RUNNER_TEMP/libasslite-bundle-smoke"
          uv venv --python 3.13 "$venv"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            py="$venv/Scripts/python.exe"
          else
            py="$venv/bin/python"
          fi
          uv pip install --python "$py" "${wrapper[0]}" "${wheel[0]}"
          "$py" "$GITHUB_WORKSPACE/tools/smoke_libasslite_bundle.py"
          "$py" "$GITHUB_WORKSPACE/tools/verify_bundle_uninstall.py" snapshot "$RUNNER_TEMP/bundle-install.json"
          echo "BUNDLE_SMOKE_PY=$py" >> "$GITHUB_ENV"
      - name: ASan allocator lifecycle smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LD_PRELOAD="$(cc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=0 \
            "$BUNDLE_SMOKE_PY" "$GITHUB_WORKSPACE/tools/smoke_libasslite_bundle.py"
      - name: Prove bundle uninstall ownership
        shell: bash
        run: |
          uv pip uninstall --python "$BUNDLE_SMOKE_PY" libasslite-bundle
          "$BUNDLE_SMOKE_PY" "$GITHUB_WORKSPACE/tools/verify_bundle_uninstall.py" verify "$RUNNER_TEMP/bundle-install.json"
          "$BUNDLE_SMOKE_PY" -c 'import importlib.util,libasslite; assert importlib.util.find_spec("libasslite_bundle") is None'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.name }}
          path: repaired-a/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources-${{ matrix.name }}
          path: corresponding-source-${{ matrix.name }}.tar.gz

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
      - run: uv build --sdist --out-dir dist libasslite-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-sdist
          path: dist/*.tar.gz

  testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: [verify-tag, build, sdist, sources]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/libasslite-bundle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [verify-tag, build, sdist, sources]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/libasslite-bundle-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/libasslite-bundle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  sources:
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sources-*
          path: sources
          merge-multiple: true
      - name: Attach corresponding source to the bundle tag
        if: startsWith(github.ref, 'refs/tags/libasslite-bundle-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" --clobber sources/*.tar.gz
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes sources/*.tar.gz
          fi
          mkdir verified-sources
          gh release download "$GITHUB_REF_NAME" --pattern 'corresponding-source-*.tar.gz' --dir verified-sources
          for source in sources/*.tar.gz; do
            cmp "$source" "verified-sources/${source##*/}"
          done
