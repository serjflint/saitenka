# Publishes the standalone system-libass loader. The wheel contains no libass binaries.
name: libasslite release

on:
  push:
    tags: ["libasslite-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package versions
        if: startsWith(github.ref, 'refs/tags/libasslite-v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib,pathlib; expected=os.environ["RELEASE_VERSION"].removeprefix("libasslite-v"); files=("libasslite/Cargo.toml","libasslite/pyproject.toml"); versions=[tomllib.loads(pathlib.Path(f).read_text())["package" if f.endswith("Cargo.toml") else "project"]["version"] for f in files]; assert versions == [expected, expected], (expected, versions)'
      - name: Verify locked dependency notices
        working-directory: libasslite
        run: |
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --locked --fail licenses.hbs --output-file /tmp/THIRD_PARTY_LICENSES
          diff -u THIRD_PARTY_LICENSES /tmp/THIRD_PARTY_LICENSES

  linux:
    name: wheel (linux ${{ matrix.arch }} ${{ matrix.py }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        py: ["3.13", "3.14t", "3.15t"]
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: libasslite
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: 2_28
          args: --release --locked --out dist --compatibility pypi -i python${{ matrix.py }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.py }}
          path: libasslite/dist

  native:
    name: wheel (${{ matrix.os }} ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        py: ["3.13", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.py }}
          allow-prereleases: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: libasslite
          args: --release --locked --out dist -i python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.py }}
          path: libasslite/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          working-directory: libasslite
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: libasslite/dist

  smoke:
    name: smoke wheel (${{ matrix.os }} ${{ matrix.py }})
    needs: [linux, native]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DOWNLOADS: ${{ runner.temp }}/vcpkg-downloads
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, py: "3.13", artifact: wheels-linux-x86_64-3.13}
          - {os: ubuntu-latest, py: "3.14t", artifact: wheels-linux-x86_64-3.14t}
          - {os: ubuntu-latest, py: "3.15t", artifact: wheels-linux-x86_64-3.15t}
          - {os: ubuntu-24.04-arm, py: "3.13", artifact: wheels-linux-aarch64-3.13}
          - {os: ubuntu-24.04-arm, py: "3.14t", artifact: wheels-linux-aarch64-3.14t}
          - {os: ubuntu-24.04-arm, py: "3.15t", artifact: wheels-linux-aarch64-3.15t}
          - {os: macos-14, py: "3.13", artifact: wheels-macos-14-3.13}
          - {os: macos-14, py: "3.14t", artifact: wheels-macos-14-3.14t}
          - {os: macos-14, py: "3.15t", artifact: wheels-macos-14-3.15t}
          - {os: windows-latest, py: "3.13", artifact: wheels-windows-latest-3.13}
          - {os: windows-latest, py: "3.14t", artifact: wheels-windows-latest-3.14t}
          - {os: windows-latest, py: "3.15t", artifact: wheels-windows-latest-3.15t}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Resolve hosted vcpkg revision
        id: vcpkg-revision
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DOWNLOADS" | Out-Null
          $revision = (git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "vcpkg revision is not a lowercase Git SHA"
          }
          "revision=$revision" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Cache vcpkg source downloads
        if: runner.os == 'Windows'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-revision.outputs.revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install libass (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libass9 fonts-noto-cjk
      - name: Install libass (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libass
          echo "LIBASSLITE_LIBRARY=$(brew --prefix libass)/lib/libass.dylib" >> "$GITHUB_ENV"
      - name: Install libass (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libass:x64-windows
          $bin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $dll = Get-ChildItem $bin | Where-Object { $_.Name -match '^(lib)?ass(-9)?\.dll$' } | Select-Object -First 1
          if (-not $dll) { throw "vcpkg installed no libass DLL" }
          "LIBASSLITE_LIBRARY=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append
          $bin | Out-File $env:GITHUB_PATH -Append
      - name: Smoke installed wheel (POSIX)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          uv python install ${{ matrix.py }}
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          uv run --python ${{ matrix.py }} --no-project --with pytest --with "${wheels[0]}" pytest -q "$GITHUB_WORKSPACE/libasslite/tests"
      - name: Smoke installed wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          uv python install ${{ matrix.py }}
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*.whl").FullName
          uv run --python ${{ matrix.py }} --no-project --with pytest --with $wheel pytest -q "$env:GITHUB_WORKSPACE/libasslite/tests"

  smoke-sdist:
    name: smoke sdist
    needs: [sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-sdist
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y libass9 fonts-noto-cjk
      - name: Build, install, and test sdist
        working-directory: ${{ runner.temp }}
        run: |
          uv python install 3.13
          sdists=("$GITHUB_WORKSPACE"/dist/libasslite-*.tar.gz)
          uv run --python 3.13 --no-project --with pytest --with "${sdists[0]}" pytest -q "$GITHUB_WORKSPACE/libasslite/tests"

  publish:
    needs: [verify-tag, linux, native, sdist, smoke, smoke-sdist]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
