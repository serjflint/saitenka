# Cross-platform EXECUTION surface — the tiers the fast gate (ci.yml) can't give real signal for.
# On each real OS it runs the `integration` boundary (real subprocess + socket, fake-mpv binary) and
# the default suite (so windows_sim paths execute for real on Windows, not simulated). The GUI tier
# (requires_display / e2e / live real-mpv) only runs on Linux under Xvfb — headless Windows/macOS
# runners can't host an mpv window reliably. Occasional by design: manual + weekly + pre-release tag.
name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA whose production code should be measured
        required: false
        type: string
      # A dispatch is a scratch run by default: it measures, and the numbers stay in the job log.
      # Publishing an unmerged tree's numbers puts points on the live dashboard that no commit on
      # `main` explains, and removing them afterwards is a hand-edit of `gh-pages`.
      store:
        description: Publish the measured results to the gh-pages dashboard
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * 1" # weekly, Mon 06:00 UTC
  push:
    tags: ["v*"]

concurrency:
  group: e2e-${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: resolve immutable revision
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - id: revision
        name: Require a full commit SHA
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "revision=${REVISION,,}" >> "$GITHUB_OUTPUT"

  e2e:
    if: github.event_name != 'pull_request' && inputs.revision == ''
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS x86_64 is not covered: none of the native add-ons `full` now installs publishes an
        # Intel wheel (libasslite, libasslite-bundle, taffylite are arm64 + manylinux + win_amd64), so
        # the leg built Rust from source and then measured text against whatever faces Homebrew's
        # libass dragged in — three rendering goldens moved for that reason alone.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # e2e exercises real per-OS transport (named pipe / unix socket), not free-threading — so pin to
      # 3.13 where fugashi ships prebuilt wheels on all three OSes. This avoids building fugashi from
      # source against system MeCab (painful/absent on Windows). The 3.14t coverage lives in ci.yml.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # libass measures the text it is given, so a leg with no CJK face measures something else: the
      # boxes it paints move and the ASS-oracle tests fail on geometry rather than on a real defect.
      # The gate and tests-ft legs already install this for the same reason.
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      # `full` carries `subtitle-geometry`, so libasslite is installed and its three ASS-oracle tests
      # run for real — with no libass to dlopen they ERROR rather than skip. Install the same published
      # runtime a `subtitle-geometry-bundle` user gets, as tests-ft does. libasslite prefers the bundle
      # over any system libass, so this also makes the leg independent of what the runner image ships.
      - name: Install the published libass runtime
        run: >-
          uv pip install --no-deps --only-binary libasslite-bundle
          --no-sources-package libasslite-bundle libasslite-bundle==0.1.3

      # Real per-OS boundary, no GUI: integration (real socket/subprocess) + windows_sim executing on
      # the real kernel. This is the leg that catches the named-pipe / Scripts-vs-bin class Linux can't.
      # `--no-sync`: the bundle is pip-installed on top of the locked env, and a re-sync would prune it.
      - name: Real-boundary + per-OS suite
        run: uv run --no-sync pytest -q -m "not (slow or requires_display or e2e or live)"

      # The GUI tier moved to `e2e-gui` below, which runs it against several mpv versions rather than
      # against whatever the runner image happens to ship.

  # The live tier, once per mpv version we make a claim about. Two floors, because a regression that
  # breaks a declared minimum would otherwise ship green against a later mpv; plus current, because
  # only that catches upstream changing under us (`sub-border-size` -> `sub-outline-size` reached a
  # tag exactly this way). Tests whose subject postdates the leg's mpv skip themselves on the
  # `mpv_min` marker, so every leg runs the identical command.
  e2e-gui:
    if: github.event_name != 'pull_request' && inputs.revision == ''
    name: e2e-gui (mpv ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # noble ships exactly 0.37.0-1ubuntu4 — the declared `MPV_MIN`, with no snapshot drift.
          # Pinned to 24.04 rather than `ubuntu-latest`: when the label moves to 26.04 it would bring
          # 0.41 with it and this leg would silently stop testing the minimum. There is no second
          # source for 0.37 (the AppImage archive starts at 0.39-based, Debian jumps 0.35 -> 0.40), so
          # when noble leaves the fleet this becomes a container or a raised `MPV_MIN`.
          - label: "0.37 floor"
            runs-on: ubuntu-24.04
            expect: "0.37"
            appimage: ""
          # `NATIVE_GEOMETRY_MPV_MIN`. No distribution ever shipped an 0.39, so 0.40 is the earliest
          # release this floor can be pinned at; 30 commits past the tag is the closest build there is.
          - label: "0.40 floor"
            runs-on: ubuntu-24.04
            expect: "0.40"
            appimage: https://github.com/pkgforge-dev/mpv-AppImage/releases/download/v0.40.0-30-g5ba7ee513/mpv-v0.40.0-30-g5ba7ee513-anylinux-x86_64.AppImage
            sha256: e7691d61e961507a282cbce56560168b99773647ab05189931abf24e71c4820e
          # Deliberately floating: a pinned "latest" only detects drift when someone remembers to bump
          # the pin, which is the failure this leg exists to catch. Safe to float because `e2e` is
          # skipped on pull_request — an upstream release can never redden someone else's PR.
          - label: current
            runs-on: ubuntu-24.04
            expect: ""
            appimage: latest
    runs-on: ${{ matrix.runs-on }}
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install CJK fonts and Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: Install mpv from apt
        if: matrix.appimage == ''
        run: sudo apt-get install -y mpv

      # AppImage rather than apt, for the versions apt cannot supply. FUSE is absent on the runners,
      # so extract instead of mounting. `--appimage-extract` writes ./squashfs-root.
      - name: Install mpv from an AppImage
        if: matrix.appimage != ''
        env:
          APPIMAGE: ${{ matrix.appimage }}
          EXPECTED_SHA: ${{ matrix.sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # `gh release view`, for the floating leg
        run: |
          set -euo pipefail
          if [[ "$APPIMAGE" == latest ]]; then
            APPIMAGE=$(gh release view --repo pkgforge-dev/mpv-AppImage \
              --json assets --jq '.assets[] | select(.name | test("anylinux-x86_64\\.AppImage$")) | .url' | head -1)
            echo "resolved latest to $APPIMAGE"
          fi
          curl -fsSL -o mpv.AppImage "$APPIMAGE"
          if [[ -n "$EXPECTED_SHA" ]]; then
            echo "$EXPECTED_SHA  mpv.AppImage" | sha256sum -c -
          fi
          chmod +x mpv.AppImage
          ./mpv.AppImage --appimage-extract >/dev/null
          sudo ln -sf "$PWD/squashfs-root/AppRun" /usr/local/bin/mpv

      # A leg that silently received the wrong mpv would pass vacuously — every version-specific test
      # skips itself, so green would mean nothing. Assert the version, and record it either way.
      - name: Confirm the mpv version under test
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          mpv --version | head -1 | tee /tmp/mpv-version
          VERSION=$(sed -n 's/^mpv v\?\([0-9]*\.[0-9]*\).*/\1/p' /tmp/mpv-version)
          echo "### mpv \`$VERSION\` (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$EXPECT" && "$VERSION" != "$EXPECT" ]]; then
            echo "expected mpv $EXPECT, got $VERSION" >&2
            exit 1
          fi

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Install the published libass runtime
        run: >-
          uv pip install --no-deps --only-binary libasslite-bundle
          --no-sources-package libasslite-bundle libasslite-bundle==0.1.3

      # `poe smoke-live` selects by path, not by marker: the live tests are gated by an env skipif, so
      # a `-m` expression would match zero tests. Every leg runs this identical command — which tests
      # execute is decided per test by `mpv_min`, not per leg by a selection expression.
      - name: GUI tier (Xvfb, real mpv)
        run: xvfb-run -a uv run --no-sync poe smoke-live


  jank-measure:
    if: github.event_name != 'pull_request'
    name: live jank replica ${{ matrix.replica }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      UV_PYTHON: "3.13"
      BENCHMARK_HARNESS: ${{ github.event_name == 'workflow_dispatch' && inputs.revision != '' && '.benchmark-harness' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}

      - name: Checkout current benchmark harness for a historical revision
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .benchmark-harness

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Install mpv + Xvfb
        run: sudo apt-get update && sudo apt-get install -y mpv xvfb

      - name: Run independent live-player replica
        run: >-
          xvfb-run -a env SAITENKA_LIVE=1 uv run --extra full python
          $BENCHMARK_HARNESS/examples/jank_live.py
          --json jank.json --bench-json jank-bench.json

      - name: Upload replica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jank-replica-${{ matrix.replica }}
          path: jank-bench.json
          retention-days: 1

  jank-store:
    if: github.event_name != 'pull_request'
    name: store live jank aggregate
    needs: [resolve, jank-measure]
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-pages
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Download replicas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jank-replica-*
          path: replicas

      - name: Validate and aggregate replicas
        run: >-
          uv run --no-project python tools/benchmark_results.py replicas/*/jank-bench.json
          --output jank-bench.json

      # Scratch dispatches measure without publishing; the guard below still runs, so a dispatch keeps
      # its jank signal without leaving a point on the dashboard.
      - name: Store jank result
        if: github.event_name != 'workflow_dispatch' || inputs.store
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Saitenka live jank
          tool: customSmallerIsBetter
          output-file-path: jank-bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          ref: ${{ needs.resolve.outputs.revision }}
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false

      - name: Apply catastrophic-jank guard after preserving history
        run: >-
          uv run --no-project python tools/benchmark_results.py
          replicas/*/jank-bench.json --output /tmp/jank-check.json
          --max-value 'live jank: total dropped frames=30'

  lifecycle-measure:
    if: github.event_name != 'pull_request'
    name: lifecycle replica ${{ matrix.replica }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    env:
      UV_PYTHON: "3.13"
      BENCHMARK_HARNESS: ${{ github.event_name == 'workflow_dispatch' && inputs.revision != '' && '.benchmark-harness' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}

      - name: Checkout current benchmark harness for a historical revision
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .benchmark-harness

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Run independent bounded-cache lifecycle replica
        run: >-
          uv run --no-sync python $BENCHMARK_HARNESS/examples/bench_responsiveness.py
          --stress --reps 3 --bench-json lifecycle-bench.json

      - name: Upload replica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-replica-${{ matrix.replica }}
          path: lifecycle-bench.json
          retention-days: 1

  lifecycle-store:
    if: github.event_name != 'pull_request'
    name: store lifecycle aggregate
    needs: [resolve, lifecycle-measure]
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-pages
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Download replicas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lifecycle-replica-*
          path: replicas

      - name: Validate and aggregate replicas
        run: >-
          uv run --no-project python tools/benchmark_results.py replicas/*/lifecycle-bench.json
          --output lifecycle-bench.json

      - name: Store lifecycle result
        if: github.event_name != 'workflow_dispatch' || inputs.store
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Saitenka bounded-cache lifecycle
          tool: customSmallerIsBetter
          output-file-path: lifecycle-bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          ref: ${{ needs.resolve.outputs.revision }}
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false

  # Install-bootstrap smoke: drive the packaged `uv tool install` entrypoint on a clean runner across
  # all three OSes — the tier no other job covers (assets from the installed wheel, PATH handoff, the
  # setup wizard's non-tty path). Wheel source on PR/dispatch/weekly (validates THIS tree's packaging);
  # PyPI on a release tag (validates the PUBLISHED artifact the way `install.sh` installs it).
  install-smoke:
    if: inputs.revision == ''
    name: install-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.13" # fugashi prebuilt wheels on all three OSes (same reason as the e2e job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - run: uv python install

      # Linux only: apt-install the runtime tools so the smoke can assert mpv/ffmpeg doctor checks are
      # `ok` (real system-tool detection). Windows/macos runners lack an easy mpv → structural-only there.
      - name: Install mpv + ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg

      - name: Install-smoke (pypi on tag, local wheel otherwise)
        run: >-
          uv run poe install-smoke
          --source ${{ startsWith(github.ref, 'refs/tags/v') && 'pypi' || 'wheel' }}
          --subtitle-geometry
          ${{ runner.os == 'Linux' && '--expect-tools mpv ffmpeg' || '' }}

  windows-regressions:
    if: github.event_name == 'pull_request'
    name: Windows IPC and runtime regressions
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Windows regressions
        run: >-
          uv run pytest -q
          tests/test_plugin.py
          tests/test_transport_windows.py
          tests/test_anki_launch.py
          tests/test_subtitle_modes.py
          tests/test_overlay_visibility.py
          tests/test_doctor.py
          tests/test_auto_advance.py
          tests/test_corpus_drift.py
