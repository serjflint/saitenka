# Cross-platform EXECUTION surface — the tiers the fast gate (ci.yml) can't give real signal for.
# On each real OS it runs the `integration` boundary (real subprocess + socket, fake-mpv binary) and
# the default suite (so windows_sim paths execute for real on Windows, not simulated). The GUI tier
# (requires_display / e2e / live real-mpv) only runs on Linux under Xvfb — headless Windows/macOS
# runners can't host an mpv window reliably. Occasional by design: manual + weekly + pre-release tag.
name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mon 06:00 UTC
  push:
    tags: ["v*"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request'
    name: e2e (${{ matrix.os }})
    permissions:
      contents: write # the Linux GUI tier auto-pushes the jank result to gh-pages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # e2e exercises real per-OS transport (named pipe / unix socket), not free-threading — so pin to
      # 3.13 where fugashi ships prebuilt wheels on all three OSes. This avoids building fugashi from
      # source against system MeCab (painful/absent on Windows). The 3.14t coverage lives in ci.yml.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      # Real per-OS boundary, no GUI: integration (real socket/subprocess) + windows_sim executing on
      # the real kernel. This is the leg that catches the named-pipe / Scripts-vs-bin class Linux can't.
      - name: Real-boundary + per-OS suite
        run: uv run --extra full pytest -q -m "not (slow or requires_display or e2e or live)"

      # Linux only: real mpv window under Xvfb — the L3 live smoke (mouse-pos → OSD coord mapping).
      - name: Install mpv + Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv xvfb

      # `poe smoke-live` = SAITENKA_LIVE=1 PYTHON_GIL=0 pytest -p no:xdist tests/test_live_mpv.py.
      # The live test is selected by that env-gated skipif + path, not a marker, so target it the same
      # way the local task does rather than a `-m` expression (which would match zero tests).
      - name: GUI tier (Linux/Xvfb, real mpv)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run poe smoke-live

      # Live-mpv jank harness (#32/#33): poll mpv's own frame-drop counters while driving the overlay —
      # the true real-time signal. `poe jank-live` fails past --max-drops (catastrophic-jank gate).
      - name: Live jank harness (Linux/Xvfb, real mpv)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run poe jank-live

      # Track the jank totals on the SAME gh-pages dashboard as the render bench (second series). Only
      # on the non-PR GUI tier (weekly/tag/dispatch) → auto-push (store) mode; matches perf.yml's rule.
      - name: Store jank result
        if: runner.os == 'Linux'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Saitenka live jank
          tool: customSmallerIsBetter
          output-file-path: jank-bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false

  # Install-bootstrap smoke: drive the packaged `uv tool install` entrypoint on a clean runner across
  # all three OSes — the tier no other job covers (assets from the installed wheel, PATH handoff, the
  # setup wizard's non-tty path). Wheel source on PR/dispatch/weekly (validates THIS tree's packaging);
  # PyPI on a release tag (validates the PUBLISHED artifact the way `install.sh` installs it).
  install-smoke:
    name: install-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.13" # fugashi prebuilt wheels on all three OSes (same reason as the e2e job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - run: uv python install

      # Linux only: apt-install the runtime tools so the smoke can assert mpv/ffmpeg doctor checks are
      # `ok` (real system-tool detection). Windows/macos runners lack an easy mpv → structural-only there.
      - name: Install mpv + ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg

      - name: Install-smoke (pypi on tag, local wheel otherwise)
        run: >-
          uv run poe install-smoke
          --source ${{ startsWith(github.ref, 'refs/tags/v') && 'pypi' || 'wheel' }}
          ${{ runner.os == 'Linux' && '--expect-tools mpv ffmpeg' || '' }}

  windows-regressions:
    if: github.event_name == 'pull_request'
    name: Windows IPC and runtime regressions
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Windows regressions
        run: >-
          uv run pytest -q
          tests/test_plugin.py
          tests/test_transport_windows.py
          tests/test_anki_launch.py
          tests/test_subtitle_modes.py
          tests/test_overlay_visibility.py
          tests/test_doctor.py
