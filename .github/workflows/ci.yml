# Fast dev gate — Linux only. `poe all` is the sim/fast tier (windows_sim + pyfakefs OSType.WINDOWS
# emulate per-OS behaviour in-process), so a Win/mac runner would re-run identical mocked paths for no
# extra signal. Real per-OS execution lives in e2e.yml. Public repo ⇒ GitHub-hosted runners are free.
#
# Core jobs: `gate` runs the gate on the pinned interpreter (3.14t), split across two legs — `poe all`
# runs the suite TWICE (coverage, then free-threaded), which on a 4-core runner is ~128s each and made
# one job own most of the run's wall-clock; the legs sync the same dev env, so this is max() not sum().
# `tests` re-runs just the suite across the interpreter matrix (lint/types/arch are version-insensitive
# — no point ×5), with a GIL-ON control on the free-threaded (`…t`) legs; `tests-ft` runs the no-GIL pass
# for those same legs in parallel, instead of sequentially after `tests`, in the lean `test` env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: poe ${{ matrix.task }} (Linux, 3.14t)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Together these two ARE `poe all` (`all = ["gate-no-ft", "test-ft"]` in pyproject) — the split is
      # the workflow's, not the gate's, so a local `poe all` stays the one command to type.
      matrix:
        task: [gate-no-ft, test-ft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fugashi (the tokenizer) has no free-threaded 3.14t wheel, so uv builds it from sdist against
      # system MeCab. Without libmecab-dev the build fails "Have you installed MeCab?".
      #
      # libass is the RUNTIME `libasslite` dlopens, not a build dep: the wrapper is pure Python and
      # imports fine without it, so the gate's converted-document oracle would skip rather than fail
      # — a libass parity test that never renders in CI is not a gate. fonts-noto-cjk so the
      # Japanese cues it lays out resolve to a real face.
      - name: Install MeCab (fugashi build dep) and libass (libasslite runtime)
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev libass9 fonts-noto-cjk

      # Non-Python binaries `poe all` shells out to: lychee (links task). shellcheck (shell task) and
      # node (unused by `all`) ship on the runner; typos (spell) rides `uvx`.
      - name: Install lychee
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: lychee

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # ast-grep (invariants gate) — the PyPI dist ships the `ast-grep` binary; expose uv's tool bin.
      - name: Install ast-grep
        run: |
          uv tool install ast-grep-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync (free-threaded 3.14t per .python-version, full extras)
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Dev gate
        run: uv run poe ${{ matrix.task }}

  layout-engine:
    name: taffylite wheel (Linux, 3.14t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MeCab (fugashi build dep)
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # Proves the DoD: the optional Rust engine's cp314t wheel builds on the free-threaded interpreter
      # (cargo ships on the runner; maturin is pulled per taffylite's build-system) and drives the full
      # parity gate — the `layout-engine` extra is DELIBERATELY absent from `poe all` (the gate job),
      # so this job is where the Rust path is exercised.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: taffylite

      - name: Sync (3.14t, full + layout-engine → builds taffylite)
        run: |
          uv python install
          uv sync --locked --extra full --extra layout-engine --no-default-groups --group test

      - name: taffylite's own tests (column parity + vendored flex fixtures)
        run: uv run --no-sync pytest -q taffylite/tests

      - name: TaffyLayoutBackend parity against the default backend
        env:
          PYTHON_GIL: "0"
        run: uv run --no-sync pytest -q tests/test_layout_backend.py

  svg-images:
    name: resvglite wheel (Linux, 3.14t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # Proves the DoD (#283): the optional resvg binding's cp314t wheel builds on the free-threaded
      # interpreter (cargo ships on the runner; maturin is pulled per resvglite's build-system) and its
      # own SVG→PNG smoke tests pass. The `images` extra is DELIBERATELY absent from `poe all`, so this
      # job is where the Rust rasterizer path is exercised.
      - name: Build + smoke-test resvglite (3.14t)
        working-directory: resvglite
        run: |
          uv python install 3.14t
          uv run --python 3.14t --with-editable . --with pytest --with pillow pytest -q tests

  libasslite:
    name: libasslite (${{ matrix.os }}, ${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        py: ["3.13", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Resolve hosted vcpkg revision
        id: vcpkg-revision
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Exported here rather than in a job-level `env:`: the `runner` context is not available
          # there, and using it fails the WHOLE workflow at startup with no jobs and no error on the
          # run itself. vcpkg reads VCPKG_DOWNLOADS from the environment, so it has to outlive this
          # step -- $GITHUB_ENV gives it the job-wide scope the job-level `env:` was reaching for.
          $downloads = "$env:RUNNER_TEMP/vcpkg-downloads"
          "VCPKG_DOWNLOADS=$downloads" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force $downloads | Out-Null
          # The BUILT packages, not their sources. Caching downloads only saves the fetch; `vcpkg
          # install libass` still compiles libass plus freetype, harfbuzz, fribidi, brotli, png and
          # zlib from source, which is why this job ran 10-13 minutes against 1 for the same work on
          # Linux. With a binary cache a warm run unpacks them instead.
          $archives = "$env:RUNNER_TEMP/vcpkg-archives"
          New-Item -ItemType Directory -Force $archives | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" | Out-File $env:GITHUB_ENV -Append
          $revision = (git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "vcpkg revision is not a lowercase Git SHA"
          }
          "revision=$revision" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Cache vcpkg source downloads
        if: runner.os == 'Windows'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-revision.outputs.revision }}
      - name: Cache vcpkg built packages
        if: runner.os == 'Windows'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-revision.outputs.revision }}-libass
      # Caches ~/.cargo (registry, git, AND ~/.cargo/bin) plus target/. Without it every leg
      # recompiled the crate twice — `cargo test` then `cargo clippy` — and rebuilt `cargo-about`
      # from source, six times over the matrix.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: libasslite
          key: ${{ matrix.py }}
      - name: Install libass (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libass9 fonts-noto-cjk
      - name: Install libass (macOS)
        if: runner.os == 'macOS'
        run: brew install libass
      - name: Install libass (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            vcpkg install libass:x64-windows
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if (-not $installed) { throw "vcpkg failed to install libass after 3 attempts" }
          $bin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $dll = Get-ChildItem $bin | Where-Object { $_.Name -match '^(lib)?ass(-9)?\.dll$' } | Select-Object -First 1
          if (-not $dll) { throw "vcpkg installed no libass DLL" }
          "LIBASSLITE_LIBRARY=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append
          $bin | Out-File $env:GITHUB_PATH -Append
      - name: Install Gate B tools (Linux)
        if: runner.os == 'Linux' && matrix.py == '3.13'
        run: sudo apt-get install -y mpv ffmpeg
      - name: Install Gate B tools (macOS)
        if: runner.os == 'macOS' && matrix.py == '3.13'
        run: brew install mpv ffmpeg
      - name: Install Gate B tools (Windows)
        if: runner.os == 'Windows' && matrix.py == '3.13'
        shell: pwsh
        run: |
          choco install mpvio ffmpeg -y --no-progress
          $mpv = Get-ChildItem "$env:ChocolateyInstall\lib\mpvio.install\tools" -Filter mpv.exe -File -Recurse | Select-Object -First 1
          if (-not $mpv) { throw "Chocolatey mpvio installed no mpv.exe" }
          $mpv.DirectoryName | Out-File $env:GITHUB_PATH -Append
      - name: Build and test
        working-directory: libasslite
        run: |
          uv python install ${{ matrix.py }}
          cargo test --locked
          cargo clippy --all-targets -- -D warnings
          uv run --python ${{ matrix.py }} --with-editable . --with pytest pytest -q -m 'not integration' tests ../tools/test_libass_token_matrix.py ../tools/test_mpv_shadow_geometry.py
      - name: Run token-ID matrix
        id: token-matrix
        working-directory: libasslite
        shell: bash
        env:
          LIBASSLITE_FONT_PROVIDER_EVIDENCE: not exposed by public ABI; see token-matrix-libass.log
        run: |
          set -o pipefail
          uv run --python ${{ matrix.py }} --with-editable . python ../tools/libass_token_matrix.py --manifest ../tests/fixtures/libass_token_matrix.json --output token-matrix.json 2>&1 | tee token-matrix-libass.log
      - name: Upload token-ID matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libass-token-matrix-${{ runner.os }}-${{ matrix.py }}
          path: |
            libasslite/token-matrix.json
            libasslite/token-matrix-libass.log
          if-no-files-found: warn
      - name: Run source/transition envelope
        if: matrix.py == '3.13'
        id: source-transition
        working-directory: libasslite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          uv run --python ${{ matrix.py }} --with-editable . \
            --with pysubs2 --with pillow --with fonttools \
            python ../tools/mpv_source_transition.py \
            --manifest ../tests/fixtures/mpv_source_transition.json \
            --output source-transition.json --repo-root .. \
            2>&1 | tee source-transition.log
          uv run --python ${{ matrix.py }} --with-editable . \
            --with pytest --with pytest-timeout --with pillow --with fonttools \
            pytest -q -m integration ../tools/test_mpv_source_transition.py
      - name: Upload source/transition evidence
        if: always() && matrix.py == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mpv-source-transition-${{ runner.os }}
          path: |
            libasslite/source-transition.json
            libasslite/source-transition.log
          if-no-files-found: warn
      - name: Run mpv/shadow geometry matrix
        if: matrix.py == '3.13'
        id: shadow-geometry
        working-directory: libasslite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          uv run --python ${{ matrix.py }} --with-editable . \
            --with pillow --with fonttools \
            python ../tools/mpv_shadow_geometry.py \
            --manifest ../tests/fixtures/mpv_shadow_geometry.json \
            --repo-root .. --output shadow-geometry.json --live \
            2>&1 | tee shadow-geometry.log
      - name: Upload mpv/shadow geometry evidence
        if: always() && matrix.py == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mpv-shadow-geometry-${{ runner.os }}
          path: |
            libasslite/shadow-geometry.json
            libasslite/shadow-geometry.log
          if-no-files-found: warn
      - name: Measure shadow prototype
        if: runner.os == 'macOS' && matrix.py == '3.13'
        id: prototype-benchmark
        working-directory: libasslite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          uv run --python ${{ matrix.py }} --with-editable . --with-editable .. \
            --with pytest \
            pytest -q ../tools/test_libass_prototype_benchmark.py
          uv run --python ${{ matrix.py }} --with-editable . --with-editable .. \
            python ../tools/libass_prototype_benchmark.py \
            --manifest ../tests/fixtures/libass_prototype_benchmark.json \
            --output prototype-benchmark.json \
            2>&1 | tee prototype-benchmark.log
          uv run --python ${{ matrix.py }} --with-editable . --with-editable .. \
            --with pytest \
            pytest -q ../tools/test_native_subtitle_integration_benchmark.py
          uv run --python ${{ matrix.py }} --with-editable . --with-editable .. \
            python ../tools/native_subtitle_integration_benchmark.py \
            --manifest ../tests/fixtures/native_subtitle_integration.json \
            --output native-subtitle-integration.json \
            2>&1 | tee native-subtitle-integration.log
      - name: Upload shadow prototype evidence
        if: always() && runner.os == 'macOS' && matrix.py == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libass-prototype-benchmark-macOS
          path: |
            libasslite/prototype-benchmark.json
            libasslite/prototype-benchmark.log
            libasslite/native-subtitle-integration.json
            libasslite/native-subtitle-integration.log
            libasslite/native-subtitle-integration-libass.log
          if-no-files-found: warn
      - name: Verify locked dependency notices
        if: runner.os == 'Linux' && matrix.py == '3.13'
        working-directory: libasslite
        run: |
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --locked --fail licenses.hbs --output-file /tmp/THIRD_PARTY_LICENSES
          diff -u THIRD_PARTY_LICENSES /tmp/THIRD_PARTY_LICENSES

  deinflect:
    name: deinflect add-on (GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: deinflect

      # The GPL add-on is a standalone package (own env/lock, zero runtime deps). overlay's `full` env
      # resolves saitenka-deinflect from PyPI, so its tests must run against THIS checkout's editable
      # source — incl. the vendored Yomitan transform conformance corpus (`tools/gen_yomitan_cases.py`).
      - name: Tests (Yomitan transform corpus)
        working-directory: deinflect
        run: |
          uv python install
          uv sync --locked
          uv run pytest -q

  tests:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.14t"]
        include:
          # 3.15 is still prerelease — let uv fetch it if published, but don't fail the run if it isn't.
          - python: "3.15"
            experimental: true
          - python: "3.15t"
            experimental: true
    env:
      # Overrides the repo's 3.14+freethreaded pin so `uv sync`/`uv run` both target the matrix leg.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MeCab (fugashi build dep)
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Without a per-leg suffix all 5 matrix legs share one cache key (derived only from
          # pyproject.toml/uv.lock) and race to save it on this concurrent matrix — whichever leg
          # finishes first wins, so the expensive 3.15/3.15t numpy-from-sdist build (no prebuilt wheel
          # yet for the prerelease interpreter) never persists and rebuilds on every run instead of once
          # per lockfile change. setup-uv's default `prune-cache: true` already keeps such source-built
          # wheels while dropping cheap-to-redownload prebuilt ones, so no extra prune step is needed.
          cache-suffix: ${{ matrix.python }}

      # Only the lean `test` group — not the full dev toolchain — so a new-interpreter leg (3.15t) isn't
      # blocked building native dev tools it never runs (memray/py-spy/…). The gate job exercises the
      # canonical `poe test`; here we invoke pytest directly (poe isn't in the test group), mirroring the
      # `test` / `test-ft` marker sets in pyproject's [tool.poe.tasks].
      - name: Sync (test group only)
        run: |
          uv python install
          uv sync --locked --extra full --no-default-groups --group test

      # --ignore the memray memory test: it's slow (never runs here) but pytest still COLLECTS it, and
      # its `limit_memory` marker comes from pytest-memray, which the lean test group omits → strict
      # markers would error at collection. The gate (full dev) collects and runs it normally.
      #
      # PYTHON_GIL=1 makes this a genuine GIL-ON control on the free-threaded (`…t`) legs — a real
      # baseline instead of a redundant no-GIL subset of the `tests-ft` job below. It's a no-op on the
      # non-`t` legs (GIL is always on there), so setting it unconditionally is harmless.
      - name: Tests
        env:
          PYTHON_GIL: "1"
        run: uv run --no-sync pytest -q -n auto --ignore=tests/test_stress_memory.py -m "not (slow or integration or requires_display or e2e or live)"

  tests-ft:
    name: tests free-threaded (${{ matrix.python }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
        include:
          - python: "3.15t"
            experimental: true
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unlike the GIL-ON matrix, `test-ft` includes integration tests. Keep its native runtime
      # prerequisites aligned with the canonical gate job above.
      - name: Install MeCab (fugashi build dep) and libass (libasslite runtime)
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev libass9 fonts-noto-cjk

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Distinct suffix from the `tests` job's `${{ matrix.python }}` key: this job runs concurrently
          # with `tests` for the same interpreter (e.g. both have a "3.14t" leg), so sharing a key would
          # reintroduce the concurrent-matrix cache race the per-leg suffix was added to stop.
          cache-suffix: ${{ matrix.python }}-ft

      - name: Sync (test group only)
        run: |
          uv python install
          uv sync --locked --extra full --no-default-groups --group test

      # The free-threaded (no-GIL) signal, run in parallel with the `tests` job's GIL-ON control instead
      # of sequentially after it — same command as before the split, just its own job.
      - name: Tests (free-threaded)
        env:
          PYTHON_GIL: "0"
        run: uv run --no-sync pytest -q -n auto --ignore=tests/test_stress_memory.py -m "not (slow or live)"
