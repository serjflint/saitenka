# Register PyPI project `saitenka-dict` with workflow `saitenka-dict-release.yml`, environment `pypi`.
name: Saitenka dictionary release

on:
  push:
    tags: ["saitenka-dict-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Verify immutable version
        run: |
          tagged_version="${GITHUB_REF_NAME#saitenka-dict-v}"
          package_version="$(uv version --project saitenka-dict --short)"
          test "$tagged_version" = "$package_version"
      - name: Test
        working-directory: saitenka-dict
        run: uv run pytest -q
      - name: Build
        run: uv build saitenka-dict --out-dir dist-pypi
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saitenka-dict-dist
          path: dist-pypi/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saitenka-dict
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saitenka-dict-dist
          path: dist-pypi/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pypi/
