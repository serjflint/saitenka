# Publishes the OPTIONAL GPL-3.0 `saitenka-deinflect` add-on (Yomitan-derived deinflection, behind the
# `deinflect`/`full` extras) to PyPI — independently of `release.yml`, which now ships only the
# Apache-2.0 `saitenka` core. deinflect versions on its own line (0.x) and changes rarely, so coupling
# it to every `saitenka` release meant it could only ship when the core did; its own tag decouples that.
#
# Own tag namespace `deinflect-v*` (distinct from saitenka's `vX.Y.Z` and taffylite's `taffylite-v*`) so
# the packages version independently. Same build-once-then-publish split and Trusted Publishing (OIDC, no
# tokens) posture as `release.yml`; see that file's header for the general pattern. Pure-Python (py3-none-
# any), so one build job — no wheel matrix (unlike taffylite's pyo3 extension).
#
# ONE-TIME SETUP (cannot live in code — maintainer, PyPI web UI): register a Trusted Publisher for project
# `saitenka-deinflect` pointing at repo `serjflint/saitenka`, workflow `deinflect-release.yml`, on BOTH
# pypi.org (env `pypi`) and test.pypi.org (env `testpypi`). The existing publisher is keyed to
# `release.yml`; OIDC is keyed to the exact workflow FILENAME, so this new file needs its own registration
# (add it — the old one can stay or be removed once release.yml no longer builds deinflect). No GitHub
# Release: deinflect is an add-on dependency, not an end-user product; PyPI is its only channel (like taffylite).
#
# Two publish paths: workflow_dispatch does a TestPyPI dry-run of the current commit; pushing a
# `deinflect-vX.Y.Z` tag does the real PyPI publish. The `pypi` environment gate still requires the
# maintainer's approval before the upload runs.
name: deinflect release

on:
  push:
    tags: ["deinflect-v*"]
  workflow_dispatch: # manual TestPyPI dry-run of the current commit

permissions:
  contents: read

jobs:
  build:
    name: Build dists
    runs-on: ubuntu-latest # pure-Python (py3-none-any) — OS-independent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      # The GPL sdist is the Corresponding Source; the wheel is a pure-Python convenience alongside it.
      - name: Build sdist + wheel
        run: uv build deinflect --out-dir dist-pypi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deinflect-dist
          path: dist-pypi/

  testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: build
    if: github.event_name == 'workflow_dispatch' # manual only
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/saitenka-deinflect
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deinflect-dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: deinflect-dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/deinflect-v') # tag only
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saitenka-deinflect
    permissions:
      id-token: write # mandatory for OIDC Trusted Publishing (no API token stored)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deinflect-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: deinflect-dist/
          skip-existing: true
