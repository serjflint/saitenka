# Tag-triggered release of the Apache-2.0 `saitenka` core: build ONCE, then publish to two places from
# the same artifacts —
#   1. a notes-only GitHub Release (changelog section for the tag; no binary assets — install is via PyPI)
#   2. PyPI, the Apache Python distributions, via Trusted Publishing (OIDC, no tokens)
# The build↔publish split is a supply-chain best practice: the publish jobs do nothing but upload the
# already-built artifacts, so nothing can tamper with them in between.
#
# The GPL `saitenka-deinflect` add-on is published SEPARATELY by `deinflect-release.yml` (`deinflect-v*`
# tag) so it versions on its own line (0.x) — `saitenka`'s dep `saitenka-deinflect>=X` resolves it from
# PyPI. Publish a new deinflect BEFORE the saitenka release that bumps its floor.
#
# IMPORTANT — supersedes `poe release-publish`'s `gh release create`: pushing a v* tag is now the sole
# release trigger. Flow: `poe release-prepare` (bump/changelog/gate/build/commit) → merge PR →
# `git push origin vX.Y.Z`. Do NOT also run `release-publish --publish`, or the Release double-creates.
#
# ONE-TIME SETUP (cannot live in code) — Trusted Publishing needs NO token/password and is unaffected
# by your account 2FA; register a publisher for project `saitenka` on BOTH sites (same repo + workflow;
# env `pypi` on pypi.org, env `testpypi` on test.pypi.org):
#   • project `saitenka` → repo `serjflint/saitenka`, workflow `release.yml`, env pypi/testpypi
# For the very first upload, create a "pending publisher" before the project exists. (deinflect's
# publisher is registered against `deinflect-release.yml` — see that file's header.)
#
# Two publish paths: a manual run (workflow_dispatch) does a TestPyPI dry-run; pushing a v* tag does the
# real GitHub Release + PyPI publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual TestPyPI dry-run of the current commit

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest # pure-Python wheels (py3-none-any) — OS-independent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fugashi has no free-threaded 3.14t wheel → uv builds it from sdist against system MeCab.
      - name: Install MeCab (fugashi build dep)
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: overlay

      - name: Sync
        working-directory: overlay
        run: |
          uv python install
          uv sync --locked --extra full

      - name: Build PyPI dist
        run: uv build overlay --out-dir dist-pypi

      - name: Release notes (changelog section for this tag)
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > dist/RELEASE_BODY.md
          [ -s dist/RELEASE_BODY.md ] || echo "Release $ver" > dist/RELEASE_BODY.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/
            dist-pypi/

  github-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # tag only, never the manual dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release (notes only)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
      - name: Publish
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: dist/RELEASE_BODY.md # notes only — no binary assets (install is via PyPI)
          draft: false # "ok on tag" — publish immediately; the human gate is deciding to push the tag
          prerelease: ${{ contains(github.ref_name, '-') }} # v0.8.0-rc1 etc.

  testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: build
    if: github.event_name == 'workflow_dispatch' # manual only
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/saitenka
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pypi/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # TestPyPI is an explicitly repeatable dry-run surface.

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # tag only
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/saitenka
    permissions:
      id-token: write # mandatory for OIDC Trusted Publishing (no API token stored)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pypi/
