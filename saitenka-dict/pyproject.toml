[project]
name = "saitenka-dict"
version = "0.1.1"
description = "Independent Python engine with high Yomitan format and lookup compatibility"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.4"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: crosses the headless Yomitan subprocess boundary"]
