[package]
name = "taffylite"
version = "0.1.0"
edition = "2021"
description = "Thin fixed-size PyO3 binding of taffy for saitenka's tooltip geometry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/serjflint/saitenka"

[lib]
name = "taffylite"
crate-type = ["cdylib"]

# pyo3 0.25, NO abi3 -> a real free-threaded cp314t wheel that loads without re-enabling the GIL.
# taffy 0.7 is the flexbox solver.
[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
taffy = "0.7"

[profile.release]
strip = true
