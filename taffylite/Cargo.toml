[package]
name = "taffylite"
version = "0.2.0"
edition = "2021"
description = "Thin fixed-size PyO3 binding of taffy for saitenka's tooltip geometry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/serjflint/saitenka"

[lib]
name = "taffylite"
crate-type = ["cdylib"]

# abi3 + abi3t (PEP 803): one Cargo config, three wheels via three interpreters — abi3-py313 (GIL 3.13+),
# version-specific cp314t (free-threaded 3.14, predates abi3t), abi3t-py315 (FT *and* GIL 3.15+). maturin
# picks the family from the build interpreter. taffy 0.7 is the flexbox solver.
[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313", "abi3t-py315"] }
taffy = "0.7"

[profile.release]
strip = true
