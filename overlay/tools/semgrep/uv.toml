# Crutch to run semgrep on free-threaded 3.14t: restate semgrep's metadata minus the ruamel.yaml.clib
# pin (no cp314t wheel; clib is an optional C speedup, ruamel falls back to pure-Python). Use only via
# `uvx --config-file` so it never shadows overlay/pyproject.toml's [tool.uv]. Re-check deps on a semgrep bump.
[[dependency-metadata]]
name = "semgrep"
version = "1.171.0"
requires-dist = [
  "attrs>=21.3","boltons~=21.0","click-option-group~=0.5","click~=8.4.2","colorama~=0.4.0",
  "exceptiongroup~=1.2.0","glom>=23.3","jsonschema~=4.25.1","mcp==1.23.3","opentelemetry-api~=1.37.0",
  "opentelemetry-sdk~=1.37.0","opentelemetry-exporter-otlp-proto-http~=1.37.0",
  "opentelemetry-instrumentation-requests~=0.58b0","opentelemetry-instrumentation-threading~=0.58b0",
  "packaging>=21.0","peewee~=3.14","pyjwt[crypto]~=2.13.0","requests~=2.22","rich>=13.5.2",
  "ruamel.yaml>=0.18.15","semantic-version~=2.10.0","tomli~=2.4.0","typing-extensions~=4.2",
  "urllib3~=2.0","wcmatch~=8.3","pywin32==311; sys_platform == 'win32'",
]
