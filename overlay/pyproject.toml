[project]
name = "saitenka"
version = "1.3.0"
description = "Learn Japanese from the video you're watching: FSRS-aware subtitle coloring + one-key Anki mining, drawn inside mpv"
readme = "PYPI.md"
license = "Apache-2.0"  # SPDX expression (PEP 639); the GPL deinflect add-on is a separate opt-in dist
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0",
    "fonttools>=4.55",
    "numpy>=2.0",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "cyclopts>=4.22.1",
    "ijson>=3.5.1",
    "platformdirs>=4.11.0",
    "keyring>=25.7.0; sys_platform != 'linux' or python_version < '3.15'",
    "psutil>=7.2.2",
    "filelock>=3.32.0",
    "certifi>=2026.6.17",
    "stamina>=26.1.0",
    "tomlkit>=0.15.1",
    "msgspec>=0.21.1",
    "structlog>=26.1.0",
    "rich>=14.0",  # progress bars in cli.py; used directly, so declared (not left transitive via cyclopts)
]

[project.urls]
Homepage = "https://github.com/serjflint/saitenka"
Documentation = "https://saitenka.readthedocs.io"
Repository = "https://github.com/serjflint/saitenka"
Issues = "https://github.com/serjflint/saitenka/issues"
Changelog = "https://github.com/serjflint/saitenka/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# GPL-3.0 add-on (derived from Yomitan) — enables the inflection-chain display. Kept OUT of the
# core deps so the default install stays Apache-2.0-clean. See ../LICENSING.md.
deinflect = ["saitenka-deinflect>=0.1.0"]
# Optional layout engine: the taffy (CSS flexbox) row-stack solver behind the LayoutBackend seam
# (TaffyLayoutBackend, #146). A Rust PyO3 extension (MIT/Apache-2.0) — kept OUT of `full` and its own
# extra because free-threaded cp314t wheels are still niche (needs a prebuilt wheel or a Rust
# toolchain), so a default install stays pure-Python. The pure-Python DefaultLayoutBackend is the
# always-available, byte-identical fallback; this is additive and parity-gated. `[tool.uv.sources]`
# resolves it from the in-repo ../taffylite for dev; it is not yet published to PyPI.
layout-engine = ["taffylite>=0.1.0"]
# JMdict English fallback (JMdict via jamdict). Used for hover tooltips when NO user dictionary is
# configured, and as the mined-card gloss source when a word isn't in your dicts. Optional so the
# default install never builds jamdict-data — an unmaintained, wheel-less sdist that fails to build
# on Windows ([WinError 32] while it decompresses jamdict.db.xz). On Windows the extra pulls
# jamdict-data-fix instead: a drop-in with the same CC BY-SA database that builds cleanly.
# Mining prefers your own dictionaries, so a dict-first user never needs this. Opt in with e.g.
# `uv tool install './overlay[jmdict]'`.
jmdict = [
    "jamdict>=0.1a11.post2",
    "jamdict-data>=1.5; platform_system != 'Windows'",
    "jamdict-data-fix>=1.5.1a2; platform_system == 'Windows'",
]
# Runtime tracing/metrics. OFF by default even when installed —
# `[telemetry] enabled = true` is the actual opt-in. Kept out of core deps so a default install never
# pulls the OTel SDK: `app/telemetry.py` imports it lazily, only once `enabled=true` is read from
# config. Both packages are pure-Python (py3-none-any), so no free-threading risk either way.
telemetry = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]
# Linux Secret Service support on Python 3.15+. Earlier Linux and other platforms install keyring by
# default; omitting this extra on 3.15+ falls back to JIMAKU_API_KEY or an owner-only file.
linux-keyring = ["keyring>=25.7.0; sys_platform == 'linux'"]
# Convenience bundles. `minimal` is the bare install (no optional features — same as no extra); it
# exists only so `saitenka[minimal]` reads as a deliberate choice. `full` pulls every portable feature
# and is what the checkout installers install; Linux Secret Service remains an explicit platform
# integration. Note `full` includes the GPL-3.0 `deinflect` add-on, so a `full` install is GPL-3.0,
# not Apache-2.0 (see ../LICENSING.md).
minimal = []
full = ["saitenka[deinflect]", "saitenka[jmdict]", "saitenka[telemetry]"]

[project.scripts]
saitenka = "overlay.app.cli:main"

[tool.uv.sources]
# Dev editable resolution of the in-repo optional layout engine (the `layout-engine` extra above).
# Only pulled when that extra is selected, so the default `--extra full` env never builds the Rust
# wheel. Stripped from published metadata — a PyPI install of `saitenka[layout-engine]` needs taffylite
# on PyPI (future work), same additive-optional posture as the extra note above.
taffylite = { path = "../taffylite", editable = true }

[tool.uv]
# Store the default project env in uv's managed cache (~/.cache/uv/environments-v2) and leave a
# lightweight `.venv` symlink for editor / basedpyright discovery, instead of a heavy in-tree `.venv`
# dir — so `overlay/` holds no env dir. The pinned-3.13 opt-in tasks manage their own envs: `fuzz` /
# `crosshair` run ephemerally (`uv run --no-project --with-editable '.[full]' --with …`, uvx-style,
# cached, no dir); `pyspy` uses `/tmp/venv-py-spy` because it prints a stable
# `sudo /tmp/venv-py-spy/bin/py-spy` path a hashed cache env can't give (a reboot just re-syncs it).
preview-features = ["centralized-project-envs"]

[dependency-groups]
# libcst is a codemod-authoring tool (see AGENTS.md "Refactoring") — nothing in src/tests/gate imports
# it. Its pyo3 native build has no free-threaded 3.15t wheel yet, and keeping it in `dev` made every
# `uv sync` (incl. the CI test matrix) fail to even create the env on 3.15+. Isolated here so the default
# dev env stays lean and forward-compatible; author codemods with `uv run --group codemod <script>`.
codemod = ["libcst>=1.8.6"]
# Minimal deps to RUN the suite. The CI test matrix installs ONLY this group
# (`--no-default-groups --group test`), so new-interpreter legs (e.g. 3.15t) aren't blocked building the
# heavy native dev tools they never use (memray/py-spy/mypy/ruff/…, which lack free-threaded wheels).
test = [
    "hypothesis>=6.157.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "dirty-equals>=0.11",
    "pyfakefs>=6.2.0",
]
dev = [
    { include-group = "test" },
    "mypy>=2.3.0",
    "playwright>=1.61.0",
    "poethepoet>=0.48.0",
    "pyrefly>=1.2.0",
    "ty>=0.0.61",
    "basedpyright>=1.39",
    "py-spy>=0.4.2",
    # memray has no Windows support (native build needs libbacktrace/pkg-config); its memory-regression
    # test (`poe stress-memory`) is a Linux/macOS dev+CI concern, so keep it off win32 — else `uv sync`
    # on the Windows E2E leg fails building it from sdist.
    "memray>=1.19.3; sys_platform != 'win32'",
    "pytest-memray>=1.9.0; sys_platform != 'win32'",
    "import-linter>=2.13",
    "complexipy>=6.2.0",
    "ruff>=0.16",
]
docs = [
    "mkdocs-include-markdown-plugin>=6.2",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: real-mpv smoke needing a display (opt-in via SAITENKA_LIVE=1; run `poe smoke-live`)",
    "windows_sim: Windows behaviour SIMULATED on the host (use_platform / pyfakefs OSType.WINDOWS). Runs everywhere by default — a fast honesty label for what is faked vs. really executed; NOT a substitute for the real-Windows executor (R5).",
    "slow: slower than the fast default loop; excluded from `poe test`, run explicitly or in CI.",
    "integration: crosses a real boundary (subprocess / socket / filesystem); excluded from `poe test`.",
    "requires_display: needs a real GUI/display; excluded from `poe test`.",
    "e2e: full-stack end-to-end; excluded from `poe test`.",
]

[tool.complexipy]
# Cognitive-complexity gate (uv run poe complexity, folded into poe all). Ratcheted via a checked-in
# baseline snapshot (complexipy-snapshot.json, `poe complexity-baseline` to regenerate after a
# deliberate refactor): today's ~40 pre-existing high-complexity functions (up to render_flow's 74,
# cli.py's run() at 147) are grandfathered, so the gate only fails on NEW complexity growth, not on
# adoption. max-complexity-allowed=15 is complexipy's own default — set explicitly so it's visible.
paths = ["src/overlay"]
max-complexity-allowed = 15

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit whitelist, NOT `select = ["ALL"]`: ALL silently enables new rules on every ruff upgrade and
# breaks the gate unpredictably. We add categories by choice, favouring ones ruff can AUTO-FIX (cheap to
# adopt and keep green). Noisy sub-rules of a kept category are pruned in `ignore` with a reason; a
# category we don't want simply isn't selected. Residual per-site suppressions are `# noqa: … # reason`.
select = [
    # already had ─────────────────────────────────────────────────────────────────────────────────
    "E", "F", "B", "SIM", "TRY", "PERF", "RUF", "UP", "C4", "TID",
    # new, auto-fixable → near-free to adopt ──────────────────────────────────────────────────────
    "W",       # pycodestyle warnings (fix)
    "I",       # isort — import ordering (fix)
    "RET",     # flake8-return — return-flow simplifications (fix)
    "PIE",     # flake8-pie — misc modernizations (fix)
    "FLY",     # flynt — static str.join → f-string (fix)
    "FURB",    # refurb — modern idioms (fix)
    "ICN",     # import conventions, e.g. `import numpy as np` (fix)
    "ISC",     # implicit string concat (ISC001 conflicts with the formatter → ignored below)
    "FA",      # future annotations (fix)
    "TC",      # type-checking-only imports → TYPE_CHECKING block (fix)
    "PGH",     # pygrep-hooks — blanket-noqa / eval / bad type-ignore
    "NPY",     # NumPy-specific incl. the 2.0 migration (NPY201, fix) — we depend on numpy>=2
    # new, security / correctness — high signal, low noise (mostly manual, but small) ──────────────
    "S",       # flake8-bandit — the SAST gate (graduated from the standalone `sec` task)
    "N",       # pep8-naming
    "ASYNC", "DTZ", "LOG", "G", "PT", "SLOT", "YTT", "EXE", "T10", "T20", "INT",
    # pylint — the logic/error rules; count/style cousins pruned in `ignore` ───────────────────────
    "PLE", "PLW", "PLC", "PLR",
    # 2026-07-27 sweep — readability/maintainability worth the one-time churn ─────────────────────
    "A",       # flake8-builtins — no shadowing id/type/list/etc.
    "RSE",     # flake8-raise — no unnecessary parens on raise (fix)
    "FIX",     # flake8-fixme — no TODO/FIXME/XXX left in the tree; track work in issues instead
    "TD",      # flake8-todos — same intent as FIX, format/completeness of any TODO that does land
    "ERA",     # eradicate — commented-out code
    "PTH",     # flake8-use-pathlib — os.path → pathlib (fix)
    "BLE",     # flake8-blind-except — no bare `except Exception` swallowing a real error
    "ARG",     # flake8-unused-arguments — dead parameters
    "Q",       # flake8-quotes — quote consistency (formatter already enforces this; belt+suspenders)
    "FBT",     # flake8-boolean-trap — no un-named boolean positional args
]
# Each entry prunes a noisy sub-rule of a SELECTED category (a category we don't want just isn't
# selected above — no ignore needed for it).
ignore = [
    # ── Formatter owns these ────────────────────────────────────────────────────────────────────────
    "E501",    # line length — the formatter governs; JP double-width chars (・/～/×/→) misreport badly
    "ISC001",  # single-line-implicit-concat — conflicts with `ruff format`
    # ── Japanese typography (RUF) ───────────────────────────────────────────────────────────────────
    "RUF001", "RUF002", "RUF003",  # "ambiguous" unicode — ・ ～ × … are intentional JP typography
    # ── tryceratops / simplify (inline error strings ARE the UX here) ───────────────────────────────
    "TRY003",  # long messages in raise — a message-class hierarchy would be ceremony without benefit
    "TRY300",  # move-return-to-else — the poll-loop/mining try/return shapes read clearer as-is
    "SIM105",  # suppress over try/except-pass — remaining pass bodies are log.debug(exc_info=True)
    # ── flake8-bandit (S): keep the gate, drop the categorically-safe rules ─────────────────────────
    "S101",    # asserts — invariant / free-threading GIL guardrails; the app never runs under -O
    "S603",    # subprocess-without-shell — ruff flags ALL subprocess; ours pass list args, no shell
    "S607",    # partial exe path — intentional PATH resolution of mpv/ffmpeg/brew (cross-platform)
    "S606",    # start-process-without-shell — the safe (no-shell) form; flagged only for being direct
    # ── pylint: keep PLE + logic rules, drop count/style cousins ────────────────────────────────────
    "PLC0415", # import-outside-top-level — deliberate lazy imports (deinflect/rich/otel/jamdict)
    "PLR2004", # magic-value — pervasive in rendering/geometry math where the literal IS the meaning
    "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0916", "PLR0917", "PLR0904", "PLR1702",
               # too-many-{returns,branches,args,positional,locals,statements,…} — complexipy's job
    "PLW0603", # global-statement — intentional module-level singletons (caches/registries)
    "PLW2901", # redefined-loop-name — idiomatic reuse in a couple of tight loops
    "PLW0108", # unnecessary-lambda — several are intentional deferred/lazy thunks
    # ── pep8-naming (N) single-rule noise ───────────────────────────────────────────────────────────
    "N818",    # exception without Error suffix — our names read fine
    "N812",    # lowercase import aliased to non-lowercase — deliberate module aliases
    # ── pytest (PT) ─────────────────────────────────────────────────────────────────────────────────
    "PT018",   # composite-assertion — `assert a and b` reads fine
]

[tool.ruff.lint.per-file-ignores]
# cyclopts binds flags via Parameter(...) calls in parameter defaults — that IS its API shape.
# T201: cli.py + cli_run.py are the CLI entrypoint/runtime-banner surface — print() IS the UX,
# mirrors sgconfig/rules/no-print-in-lib.yml's `ignores:` (which cli_run.py should join too).
"src/overlay/app/cli.py" = ["B008", "T201"]
"src/overlay/app/cli_run.py" = ["T201"]
# T201: interactive first-run wizards — print() is the prompt UX, matches no-print-in-lib.yml.
"src/overlay/app/init_wizard.py" = ["T201"]
"src/overlay/app/setup_wizard.py" = ["T201"]
# Palette's defaults are pure constant color parses (_hex on literals) in a frozen dataclass —
# hoisting five one-use constants would only add indirection.
"src/overlay/app/scoring.py" = ["RUF009"]
# GPL-3.0 chokepoint: only these two modules may import the optional saitenka_deinflect add-on.
# Defense-in-depth alongside the .importlinter gpl-chokepoint contract.
"src/overlay/app/dictionary.py" = ["TID251"]
# layout-engine chokepoint: only this module may import the optional taffylite Rust engine.
# Defense-in-depth alongside the .importlinter layout-engine-chokepoint contract.
"src/overlay/render/layout_backend.py" = ["TID251"]
# T201: doctor is a user-invoked diagnostic subcommand — print() IS its report output.
"src/overlay/app/doctor.py" = ["TID251", "T201"]
# T201: user-invoked import subcommand — print() reports progress/results to the terminal.
"src/overlay/app/yomitan_import.py" = ["T201"]
# T201: pre-logging bootstrap — runs before configure_logging() attaches handlers, so log.*
# has nowhere to go yet; matches no-print-in-lib.yml.
"src/overlay/app/reader_deps.py" = ["T201"]
"src/overlay/app/crashlog.py" = ["T201"]
# media.py dispatches on sys.platform with a `return` per branch; the explicit `else` is a DELIBERATE
# mypy platform-narrowing guard (without it, mypy flags the fall-through as unreachable on the build
# host). RET's else-after-return "simplification" fights that guard, so opt those rules out here.
"src/overlay/app/media.py" = ["RET505", "RET506", "RET508"]
# Property tests exercise the deinflect chain directly (hypothesis), not through the app chokepoint.
"tests/test_properties.py" = ["TID251"]
# Tests legitimately reach into private members and take shortcuts a library shouldn't:
"tests/**" = [
    "SLF001",  # white-box access to _private state is how the internals get tested
    "S101",    # asserts ARE the test framework
    "S105", "S106", "S311",  # fake tokens/passwords + non-crypto random in fixtures
    "S108",    # temp-file paths in tests are throwaway fixtures, not process-lifetime files
    "S110",    # try/except/pass in test teardown/probes is fine
    "PLR2004", # magic values are fine in test expectations
    "PT011", "PT017", "PT018",  # broad pytest.raises / assert-in-except / composite asserts are fine here
    "PLW1510", # subprocess.run in tests drives a child then asserts on .returncode/.stdout — the test
               # IS the check; explicit check= would be noise. (In src/, PLW1510 now gates: every call
               # carries an explicit check=False after the 2026-07-25 sweep.)
]
"examples/**" = ["T201", "S", "INP001", "BLE001", "E731", "FBT001", "FBT002", "FBT003"]  # demo/bench
"tools/**" = ["T201", "INP001"]  # dev codegen scripts: print() is the output; not an importable package
# scripts: print() is the output, security/init noise N/A, terse blind-except/lambda-assign is
# normal for ad-hoc benchmarking harnesses that must never crash mid-run and don't need named
# helpers, and positional bool flags calling internal-only helpers don't warrant keyword ceremony.
# NOTE: security suppressions in `src/` are DELIBERATELY per-line `# noqa: S…  # reason` at each
# site (see anki.py/jimaku.py/wordlists.py/crashlog.py/fsrs.py/dictdb.py/doctor.py), not centralized
# here — a per-line noqa is more precise (a NEW unsafe occurrence in the same file still fails) and
# self-documents the reason next to the code. Config-level ignores stay reserved for categorical rules.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"saitenka_deinflect".msg = "GPL-3.0 add-on — only overlay/app/dictionary.py and overlay/app/doctor.py may import it (see .importlinter's gpl-chokepoint contract)."
"taffylite".msg = "Optional layout engine — only overlay/render/layout_backend.py (TaffyLayoutBackend) may import it (see .importlinter's layout-engine-chokepoint contract)."

[tool.mypy]
python_version = "3.13"
files = ["src/overlay"]
# Stage 8b tooling: good additional checks, NOT --strict (plan decision).
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true   # fugashi/jamdict/unidic ship no stubs

[tool.basedpyright]
include = ["src/overlay"]
typeCheckingMode = "basic"
reportMissingImports = "none"   # fugashi/jamdict ship no stubs; mypy covers import sanity

# Spell-check allowlist lives in the repo-root _typos.toml (poe spell scans repo-wide; typos resolves
# config from the scan root, not from overlay/).

# Dependency hygiene (poe deps, now clean → folded into `all`). Every ignore below is a runtime-implicit
# data package, an extras self-reference, or a deliberate forward-declaration — not a silenced defect.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "unidic-lite",      # runtime dictionary data loaded implicitly by fugashi (never imported)
    "jamdict-data",     # CC BY-SA DB loaded by jamdict at runtime (never imported)
    "jamdict-data-fix", # Windows drop-in for jamdict-data (never imported)
    "saitenka", # self-reference from the `full`/`minimal` convenience extras
    "saitenka-deinflect", # `deinflect` extra; imported as module saitenka_deinflect (name mismatch)
    "filelock",         # declared ahead of use for the planned Windows mandatory-lock work; not yet
                        # imported. Remove IF that work is dropped.
]
DEP003 = ["saitenka_deinflect"]  # GPL add-on via the `deinflect` extra (PyPI) — the chokepoint import

# --- Stage 8b: local task runner (no CI — `poe all` is the pre-push gate) -------------------------
# Every `uv run` carries `--extra full` so the optional features (deinflect inflection chain + JMdict
# fallback) are present for tests without living in the dev group — they're optional EXTRAS, not dev
# deps. Keeping the flag on every task avoids uv re-syncing (installing/removing the extras) between
# steps of `poe all`.
[tool.poe.tasks]
lint = { shell = "uv run --extra full ruff check --fix src tests examples && uv run --extra full ruff format src tests examples" }
types = { shell = "uv run --extra full mypy && uv run --extra full basedpyright && uv run --extra full pyrefly check src/overlay && (uv run --extra full ty check src/overlay || true)" }
# Dependency-contract engine: no import cycles among overlay's top-level packages, sc/model.py stay
# PIL-agnostic, and the saitenka_deinflect GPL add-on is only imported through its app/dictionary.py
# + app/doctor.py chokepoint. Config: .importlinter.
arch = { shell = "uv run --extra full lint-imports" }
# Call-level invariant gate (ast-grep, config: sgconfig.yml) — anti-patterns import-linter can't see:
# no time.sleep in the mpv reader thread, single-writer IPC pipe, no model-derived readings.
# `severity: error` fails the gate; `warning` advises. Rust binary, no build/FT exposure. Tests run
# first so a rule can't rot into a no-op. Install: `uvx --from ast-grep-cli ast-grep` / `brew install`.
invariants = { shell = "ast-grep test --skip-snapshot-tests && ast-grep scan" }
invariants-test = { shell = "ast-grep test --skip-snapshot-tests" }
# Test-code lint (ast-grep, config: sgconfig-tests.yml) — the sharpen loop's Conformance instrument
# (.agents/sharpen/SPEC.md, Axis 2): measures test↔implementation coupling (private-attr asserts,
# mock-interaction, ambient wall-clock/entropy, env mutation, mutable session fixtures). ALL rules are
# `warning` (advisory — exits 0), scoped to tests/, and DELIBERATELY NOT in `poe all`. `--json=compact`
# for the loop's per-file counts. Planted +/- tests keep a rule from rotting into a no-op.
test-lint = { shell = "ast-grep test -c sgconfig-tests.yml --skip-snapshot-tests && ast-grep scan -c sgconfig-tests.yml tests" }
test-lint-test = { shell = "ast-grep test -c sgconfig-tests.yml --skip-snapshot-tests" }
test-lint-json = { shell = "ast-grep scan -c sgconfig-tests.yml --json=compact tests" }
# OPT-IN taint tier (not in `all`): semgrep dataflow for what ast-grep can't — model output reaching a
# reading/pitch field via intermediate vars. Pinned to 3.13 (prebuilt clib wheel; semgrep never imports
# our code, so its interpreter is unrelated to the 3.14t runtime). For 3.14t use the clib-drop crutch:
# `--config-file tools/semgrep/uv.toml --python 3.14t`. ~2s → opt-in; run when touching lookup/scoring/miner.
invariants-taint = { shell = "uvx --python 3.13 semgrep scan --config tools/semgrep/rules.yml src" }
# Cognitive-complexity gate, ratcheted against complexipy-snapshot.json (config: [tool.complexipy]).
# Fails only on NEW complexity growth past max-complexity-allowed=15, not on pre-existing debt.
complexity = { shell = "uv run --extra full complexipy" }
# Regenerate the baseline after a DELIBERATE refactor changes function complexity on purpose (run,
# review the snapshot diff, commit it alongside the refactor — never to silence a real regression).
complexity-baseline = { shell = "uv run --extra full complexipy --snapshot-create" }
# Fast default loop: everything EXCEPT the opt-in tiers (windows_sim stays IN — it's fast + mac-runnable).
# Inner-loop task only — NOT in `all`: `cov` runs a superset marker set with `-n auto`, so it is the
# gate's functional run too (no point running the suite a third time without coverage).
test = { shell = "uv run --extra full pytest -q -n auto -m 'not (slow or integration or requires_display or e2e or live)'" }
# -n auto is safe under PYTHON_GIL=0: each xdist worker is its own free-threaded interpreter, so the
# FT code paths still run without the GIL — it just parallelises (91s → ~22s).
test-ft = { shell = "PYTHON_GIL=0 uv run --extra full pytest -q -n auto -m 'not (slow or live)'" }
# Inner-loop test selector (NOT a gate — `all`/`test-ft` stay the pre-push net). Runs only the tests a
# change can affect: ruff dependents reverse-closure + a full-run fallback on static-graph blind spots.
# `poe affected` (working tree) / `poe affected --base main` (vs a branch) / `--print` to just list them.
affected = { cmd = "uv run --extra full python tools/affected.py" }
# The gate's functional + coverage run. `-n auto` parallelises it (~99s → ~38s); pytest-cov combines
# per-worker data. Its marker set (`not (slow or live)`) is a superset of `test`'s, so `all` runs this
# instead of a separate `test` — the suite runs twice total (here + `test-ft` under PYTHON_GIL=0).
cov = "uv run --extra full pytest -q -n auto --cov=overlay --cov-report=term-missing --cov-fail-under=85 -m 'not (slow or live)'"
bench = "uv run --extra full python examples/bench_responsiveness.py --pathological --reps 8"
# Dict-free deterministic render bench — the CI/asv-safe gate target (no overlay.toml, no randomness).
# --loops characterizes run-to-run variance (CV); --bench-json emits the gh-pages history JSON.
synth-bench = "uv run --extra full python examples/bench_responsiveness.py --synth --reps 5 --loops 5"
# Local perf rot-guard (#33): ratchet the --synth render throughput against perf-baseline.json, failing
# only on GROSS regression (per-metric tolerance: median +50%, tail-noisy p99 +100% → catches a 2-4x
# rot, never micro-drift). LOCAL/OPT-IN, wall-clock + machine-specific → deliberately NOT in `all` (like
# mutate/bench). The statistical trend gate is github-action-benchmark on gh-pages (.github/workflows/
# perf.yml). Re-bless after a deliberate perf change. See tools/perf_gate.py.
perf-check = "uv run --extra full python tools/perf_gate.py"
perf-bless = "uv run --extra full python tools/perf_gate.py --bless"
# Idle-paced ground truth (hot-path-idle-spreading-plan.md Stage 1) — real-time dwell between
# synthetic cues, so it's slower than the other benches; not folded into `bench`/`poe all`.
# PYTHON_GIL=0 so the prefetch workers run truly free-threaded (fugashi is main-thread-only here, so
# no MeCab races) — without it fugashi re-enables the GIL and worker scaling collapses to ~2, halving
# decode stall (48%→19%) and inflating the finish_tail tail measured for the idle-warming path.
timeline-bench = { shell = "PYTHON_GIL=0 uv run --extra full python examples/bench_responsiveness.py --timeline" }
# Reproduces the SHIPPED/real config (overlay.toml: head_prefetch_lookahead=1, prefetch_lookahead=2)
# with the banded (windowed) render path on (SAITENKA_BANDED=1 flips reader._banded, no config file) —
# the only bench that mirrors a live session's hover-warmth + worker keep-ahead. Use it to measure the
# engaged head-first render fix against the report baseline (2.8s full renders → queue-11 backlog).
timeline-bench-banded = { shell = "PYTHON_GIL=0 uv run --extra full python examples/bench_responsiveness.py --timeline --timeline-head-prefetch 1 --timeline-lookahead 2" }
# L3 real-mpv smoke: opens a real mpv window + injects mouse/keys (needs a display). Serial (-p no:xdist).
# No PYTHON_GIL=0 — the smoke tests input→OSD mapping, not free-threading, and forcing the GIL off is a
# fatal `config_read_gil` error on a non-free-threaded interpreter (the E2E leg pins 3.13 for fugashi wheels).
smoke-live = { shell = "SAITENKA_LIVE=1 uv run --extra full pytest -q -p no:xdist tests/test_live_mpv.py" }
# Memory-regression companion to `test`/`all` — memray tracking overhead makes this ~1 minute, so it's
# `slow`-marked (excluded from the fast default loop) and run explicitly, not as part of `poe all`.
stress-memory = { shell = "uv run --extra full pytest -q --memray -p no:xdist tests/test_stress_memory.py" }
# py-spy can't introspect the free-threaded 3.14t build ("Failed to find python version from target
# process") — same out-of-process 3.13 crutch as fuzz/crosshair/invariants-taint, in
# `/tmp/venv-py-spy` (a reboot/tmp-cleaner just wipes it and the next run re-syncs; a stable ABSOLUTE
# path is what the printed `sudo …/bin/py-spy` line needs — a hashed uv-cache env can't give one).
# NOT `uv run --isolated` either — that forks the interpreter as a CHILD of the `uv` process, so py-spy
# needs `--subprocesses` to see it, which measured ~10x slower sampling (100-300 Hz → 10-30 Hz) — too
# coarse for the ms-scale jank this profiles. A stable venv lets py-spy attach to the interpreter
# directly, no wrapper, full rate).
# `sudo` needs a real controlling tty that poe's subprocess doesn't give it ("a terminal is required to
# read the password" even run from an interactive shell), so this task only syncs the env and PRINTS
# the profiling command — copy-paste and run the printed line yourself, NOT through poe. `uv sync`
# (not a hand-rolled `uv venv`/`uv pip install`) manages `/tmp/venv-py-spy`; `py-spy` is already a
# `full`-extra dependency (pyproject `[project.optional-dependencies]`), so the sync also installs it
# INTO `/tmp/venv-py-spy` — no Homebrew/uvx py-spy needed, one fewer moving part.
stress-pyspy = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'env ready — run this yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/stress-profile.raw -f raw --rate 200 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --stress --reps 3\"" }
# Same 3.13 crutch, but profiling the VOCAB render benchmark (examples/vocab.json — real-episode words,
# parser out of the loop) so the sampled hot frames are pure lookup/decode/SC-walk/document-layout: the
# windowed render tail this is meant to dissect. Prints the sudo line to run yourself.
# `--subprocesses` on all py-spy tasks: harmless single-process, but never silently miss a worker (the
# GIL-fallback process pool that `--vocab --parallel` uses — see vocab-pyspy-mp).
vocab-pyspy = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'env ready — run this yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/vocab-profile.raw -f raw --rate 200 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --vocab --reps 3\"" }
# END-STATE profile of the fixed + banded + PARALLEL render. py-spy CANNOT introspect the free-threaded
# 3.14t build ("Failed to find a python interpreter in the .data section" — the interpreter state isn't
# where py-spy scans on nogil; benfred/py-spy#460), so profile on GIL 3.13 where pick_executor falls back
# to a PROCESS pool: --subprocesses captures the workers. The parallelism mechanism differs from the
# shipped threads, but the per-render hot-spots (getmask2/getlength, banded block layout) are identical —
# which is what this profile is for. (For a true free-threaded sample py-spy is out; a nogil-aware
# sampler would be needed.)
vocab-pyspy-mp = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'run yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/vocab-mp-profile.raw -f raw --rate 200 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --vocab --parallel --reps 3\"" }
# TIMELINE: a realistic idle-paced session — real-time dwell between cues, prefetch/lookahead warming
# ahead of hovers. Dwell-paced → the process is mostly SLEEPING, so on-CPU samples are sparse; the
# bench's OWN report (misses / worker lead time / warm-vs-cold) is the primary SCHEDULING signal — does
# prefetch keep ahead? py-spy just shows where the prefetch+render CPU goes. --rate 500 to catch enough
# active samples; add `--timeline-dwell-s 0.05` for a dense CPU profile at the cost of realism.
timeline-pyspy = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'env ready — run this yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/timeline-profile.raw -f raw --rate 500 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --timeline --timeline-cues 120 --timeline-head-prefetch 1 --timeline-lookahead 2\"" }
# TRACE REPLAY: the truthful stress profile — replays a real diagnostics report's event cadence with
# idle COMPRESSED (--idle-scale), so the sampled CPU is the actual hover/scroll/cue mix a session
# produced, not a synthetic guess. Auto-picks the newest report; squeeze --idle-scale down to starve
# prefetch. Same 3.14t→3.13 crutch as the others; --rate 500 since idle-compressed still sleeps some.
trace-pyspy = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'env ready — run this yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/trace-profile.raw -f raw --rate 500 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --trace \\\"\\$(ls -t ~/.local/share/saitenka/reports/*.zip | head -1)\\\" --idle-scale 0.05 --trace-loops 5\"" }
# --scroll-jank CPU profile: WHERE the scroll-frame tail goes — getmask2 in the scrolled-into block, or
# the viewport re-composite? Synchronous single-process render (prefetch=False) → CPU-dense, no --idle.
scroll-jank-pyspy = { shell = "UV_PROJECT_ENVIRONMENT=/tmp/venv-py-spy uv sync --python 3.13 --extra full -q && echo 'env ready — run this yourself (sudo needs a real terminal):' && echo \"sudo /tmp/venv-py-spy/bin/py-spy record --subprocesses -o /tmp/scroll-jank-profile.raw -f raw --rate 200 -- /tmp/venv-py-spy/bin/python examples/bench_responsiveness.py --scroll-jank --reps 3\"" }
# Offline coupling/complexity metrics (pyscn) — NOT in `all`: an analysis aid to guide the
# controller.py split, not a gate (Goodhart: metrics inform, contracts enforce). `pyscn` runs
# out-of-process on the standard interpreter (a separate Go binary), never imported into the
# free-threaded runtime. Install once: `uv tool install pyscn`.
arch-report = { shell = "uvx pyscn analyze --select complexity,cbo --no-open src/overlay" }
# Mutation campaign over the pure core (cosmic-ray, git-guarded, scoped). Opt-in, NOT in `all` —
# minutes/module. `poe mutate` runs all targets; `poe mutate sub_index` narrows. Survivors → harden
# with Hypothesis properties, re-run to confirm. See tools/mutate/run.py + AGENTS.md "Mutation auditing".
mutate = { cmd = "uv run --extra full --with cosmic-ray python tools/mutate/run.py" }
# Coverage-guided fuzzing of the subtitle parser (atheris/libFuzzer). Opt-in, NOT in `all`. Runs in an
# EPHEMERAL uvx-style env (`uv run --no-project --with-editable '.[full]' --with atheris`, uv-cached, no
# dir) pinned to CPython 3.13 — atheris is a libFuzzer C-extension that can't load under the
# free-threaded 3.14t default; the parser itself is pure-Python, fine on 3.13
# (same out-of-process 3.13 pattern as `invariants-taint`). 60s bounded default; a crasher drops a
# `crash-*` repro → shrink it, add as a regression golden, fix. Complements the Hypothesis property tests.
fuzz = { shell = "uv run --no-project --python 3.13 --with-editable '.[full]' --with atheris python tools/fuzz/fuzz_sub_index.py -max_total_time=60 -artifact_prefix=tools/fuzz/" }
# Symbolic-execution adequacy pass over the pure-core property tests (CrossHair via the Hypothesis
# `crosshair` backend) — a THIRD technique next to mutation (cosmic-ray) and coverage-guided fuzzing
# (atheris): a z3 SMT solver finds exact-boundary counterexamples random search misses. Opt-in, NOT in
# `all` (slow). Runs in an EPHEMERAL uvx-style env (`uv run --no-project`, uv-cached, no dir) pinned to
# CPython 3.13 (z3 is a C-ext, no free-threading); the
# crosshair backend is registered in conftest only when hypothesis-crosshair is present. HypoFuzz was
# TEST-DRIVEN (ran clean on the property suite, found nothing atheris/crosshair didn't) but NOT adopted:
# its licence is `LicenseRef-HypoFuzz` (custom/source-available, not FOSS) — unfit to commit into a
# licence-careful Apache-2.0 repo — and atheris+crosshair already cover the pure-core adequacy angle.
crosshair = { shell = "uv run --no-project --python 3.13 --with-editable '.[full]' --with hypothesis-crosshair pytest -q -p no:randomly --hypothesis-profile=crosshair tests/test_sub_index_properties.py tests/test_properties.py tests/test_property.py" }
# Draft the unreleased changelog from Conventional Commits (repo root); review, then hand-merge into
# CHANGELOG.md — generated output is raw material, not the finished changelog.
changelog = { shell = "cd .. && uvx git-cliff@2.13.1 --unreleased" }
# RELEASING.md steps 1-5, automated: bump version, insert the curated RELEASE_NOTES.md entry (write
# that first — the changelog is never auto-generated unattended), gate, build+smoke-test the wheel,
# commit. Never pushes or opens a PR on its own. $POE_EXTRA_ARGS forwards flags, e.g.
# `poe release-prepare --dry-run` or `--bump minor` — see `release.py`'s docstring for the full set.
release-prepare = { shell = "cd .. && uv run install/release.py prepare $POE_EXTRA_ARGS" }
# RELEASING.md steps 7-8, automated: tag, rebuild+smoke-test the wheel from the merged commit, draft the
# (notes-only) GitHub Release. Draft unless `--publish`; `uv publish` to PyPI stays a separate manual step.
release-publish = { shell = "cd .. && uv run install/release.py publish $POE_EXTRA_ARGS" }

# --- Supply-chain & hygiene (test-driven & wired 2026-07-25; see vibe/quality-growth-plan.md) --------
# Winners chosen by running each candidate on THIS repo, not by reputation. Design: only fast,
# deterministic, already-clean checks join `all` (audit/spell/links). Tools that surface real findings
# today (sec/deps/deadcode/dup) stay ADVISORY — graduating each to the gate is its own focused sweep,
# deliberately deferred. Rust/Go binaries are preferred (out-of-process → free-threading-safe).

# GATE (in `all`) — vulnerability scan over the resolved uv.lock. Native uv command (Rust): reads the
# lockfile directly, no venv build (pip-audit SIGABRTs building one on uv-managed pythons; its
# `--no-deps` mode is the documented fallback). Experimental → the preview flag pins the interface.
audit = { shell = "uv audit --preview-features audit-command" }
# ADVISORY (not in `all`) — second-opinion CVE scan via pip-audit (PyPA Advisory DB + OSV) over the
# exported lockfile. `--no-deps` audits the pinned graph WITHOUT building a venv (a full build SIGABRTs
# on uv-managed pythons, per the `audit` note above); runs out-of-process via uvx (free-threading-safe).
pip-audit = { shell = "uv export --frozen --no-emit-project --no-hashes --all-extras | uvx pip-audit --no-deps -r /dev/stdin" }
# GATE (in `all`) — spelling across code + docs. typos (Rust via uvx), gitignore-aware; allowlist in
# [tool.typos]. Ran from repo root so it covers the top-level docs and the deinflect add-on too.
spell = { shell = "cd .. && uvx typos" }
# GATE (in `all`) — local link integrity (relative/anchor links resolve). `--offline` checks only
# on-disk targets → deterministic and network-free; the full external-URL crawl is the advisory
# `links-net` below (network → flaky → not in `all`). lychee = Rust binary (brew install lychee).
# `git ls-files` scopes it to TRACKED markdown — an explicit `**/*.md` glob bypasses .gitignore and would
# drag in git-ignored `vibe/` scratch (Yandex-wiki root-relative links that can't resolve on disk).
links = { shell = "cd .. && lychee --offline --no-progress $(git ls-files '*.md')" }
links-net = { shell = "cd .. && lychee --cache --max-cache-age 14d --no-progress $(git ls-files '*.md')" }
# Docs site (Material for MkDocs → Read the Docs). Source lives at the repo root (../mkdocs.yml, ../docs),
# but the build runs here because this env has the `saitenka` package + `docs` group. `--strict` fails on
# broken links/nav, so a docs regression is caught locally, not on RTD. NOT in `all` (docs deps are an
# opt-in group); builds to ../site/, `docs-serve` live-reloads at http://127.0.0.1:8000.
# `docs-cli` regenerates the committed CLI reference from the cyclopts app (run after changing commands).
docs = { shell = "uv run --group docs mkdocs build -f ../mkdocs.yml --strict" }
docs-serve = { shell = "uv run --group docs mkdocs serve -f ../mkdocs.yml" }
docs-cli = { shell = "uv run python -m overlay.app.gen_cli_docs > ../docs/usage/cli.md" }
# Publish the install scripts to the gh-pages branch (https://serjflint.github.io/saitenka/). Keeps the
# served install.sh/install.ps1 in sync with install/overlay-install.{sh,ps1}; re-run after editing them
# and at each release. Not in `all` (touches the remote).
pages = { shell = "cd .. && bash install/publish-pages.sh" }

# SAST (flake8-bandit `S`) is now folded into the ruff `select` above, so it runs inside `lint` (in
# `all`) — no separate `sec` task. The 2026-07-25 triage put reasoned per-line `# noqa: S…` at each
# legitimate site (subprocess launch of mpv/ffmpeg/anki, localhost/HTTPS urlopen, the dictdb SQL) and
# the four categorically-safe rules in `ignore`. semgrep taint (the cross-file layer `S` can't do)
# stays as the opt-in `invariants-taint`.
# GATE (in `all`) — unused/missing/misplaced deps. deptry, run in-project (uv run --with) so PIL→pillow
# etc. resolve via installed metadata; running it isolated via uvx misreports everything. Clean after
# the [tool.deptry] ignores (declared rich, forward-declared filelock). JSON for agents: add `-o dep.json`.
deps = { shell = "uv run --extra full --with deptry deptry src" }
# ADVISORY — cross-module dead code (ruff `F` only catches unused imports/locals). vulture with a
# whitelist for interface-mandated params (structlog processors, OTel exporter overrides, signal
# handlers) that are "unused" by signature but required. Tune with --min-confidence.
deadcode = { shell = "uvx vulture src .vulture_whitelist.py --min-confidence 80" }
# ADVISORY — copy-paste detection. jscpd v5 (Rust core via npx). 0.19% today (the controller split
# paid off); `--threshold` can gate a ceiling later. `--reporters ai` emits agent/MCP-friendly output.
dup = { shell = "npx --yes jscpd@latest src --min-tokens 50 --threshold 3 --reporters consoleFull" }
# ADVISORY (NOT in `all`) — repowise's static code-health + PERF-RISK (I/O-in-loop / N+1 / regex- and
# defer-in-loop / blocking-in-async), the unique non-LLM check it offers over our other tools. Runs
# in-process, no network, NO LLM (it rebuilds its own call graph each run — no stale-index problem; the
# `--generate-code` LLM flag is opt-in and NOT used here). Metric-that-informs, not a contract that
# enforces (Goodhart), so it stays out of the gate. Prereq: `uv tool install repowise` + a built index
# (.repowise/). `--format json` for agent triage. See vibe/quality-growth-plan.md (repowise finding).
perf-risk = { shell = "cd .. && repowise health --module overlay/src/overlay" }
# ADVISORY (NOT in `all`) — local-MLX backend for repowise's LLM doc generation (`repowise init`/
# `update`, distinct from the no-LLM `perf-risk` above). `.repowise/` (the generated wiki) is
# deliberately NOT committed — same treatment as `.mypy_cache`, a regeneratable local index the tool
# re-derives, not source. These tasks persist the WORKING setup instead, so it doesn't need
# re-deriving: `repowise-mlx-install` once, `repowise-mlx-serve` in one terminal, `repowise-doc-gen`/
# `-update` in another. Qwen2.5-Coder-7B-Instruct-4bit over a bigger model: a full source-verified
# audit (all pages, not a sample) found 90.7% doc accuracy, and upgrading the worst pages to
# 14B+speculative-decoding did NOT fix the remaining hallucinations (a prompt-grounding gap in
# repowise itself, not a capability ceiling this machine can buy its way out of) while nearly OOMing
# it via unbounded KV-cache growth. `--embedder mock` avoids repowise silently 404ing every embedding
# call against `/v1/embeddings` (unimplemented by `mlx_lm.server`) — swap to `--embedder ollama` (see
# repowise's own `--help`) for real semantic search instead of FTS-only. Findings + the diagnosed
# root cause: `vibe/repowise-local-mlx-investigation.md`.
repowise-mlx-install = { shell = "uv tool install mlx-lm --python 3.12" }  # 3.14t default breaks mlx
repowise-mlx-serve = { shell = "mlx_lm.server --model mlx-community/Qwen2.5-Coder-7B-Instruct-4bit --port 8080 --decode-concurrency 1 --prompt-concurrency 1" }
repowise-doc-gen = { shell = "cd .. && OPENAI_BASE_URL=http://localhost:8080/v1 OPENAI_API_KEY=not-needed repowise init --provider openai --model mlx-community/Qwen2.5-Coder-7B-Instruct-4bit --embedder mock --concurrency 1 -y overlay" }
repowise-doc-update = { shell = "cd .. && OPENAI_BASE_URL=http://localhost:8080/v1 OPENAI_API_KEY=not-needed repowise update --provider openai --model mlx-community/Qwen2.5-Coder-7B-Instruct-4bit --embedder mock --concurrency 1 overlay" }
# GATE (in `all`) — dependency license boundary. The ONLY copyleft in our graph must be our own
# deliberate GPL-3.0 add-on (saitenka-deinflect); ANY other GPL/AGPL/LGPL is a transitive leak
# into the Apache-2.0-clean core and fails. Complements the import-linter GPL chokepoint (code boundary)
# and ruff TID251 (import boundary) with a dependency-graph boundary. If a benign LGPL dep ever appears,
# add it to --ignore-packages with a note (ratchet), don't drop the check. pip-licenses reads installed
# metadata → needs the full env. See ../LICENSING.md.
licenses = { shell = "uv run --extra full --with pip-licenses pip-licenses --partial-match --fail-on 'GPL' --ignore-packages saitenka-deinflect" }
# GATE (in `all`) — shell installer static analysis (shellcheck, standalone binary: brew install
# shellcheck). The install/*.sh scripts run on users' machines, so correctness matters. Clean at
# default severity after the 2026-07-25 nit sweep (SC2043/SC2012 fixed, SC2016/SC2329 reasoned-disabled).
shell = { shell = "cd .. && shellcheck install/*.sh" }
# ADVISORY — PowerShell installer static analysis (PSScriptAnalyzer). Prereqs: `brew install --cask
# powershell` + `pwsh -c 'Install-Module PSScriptAnalyzer -Scope CurrentUser'`. Kept OUT of `hygiene`
# because pwsh is a heavy, mac-uncommon prereq and the .ps1 files only matter for Windows packaging.
# Excludes PSAvoidUsingWriteHost (installers legitimately colour output) + PSUseBOMForUnicodeEncodedFile
# (bad advice cross-platform); leaves the real ones (empty catch, Invoke-Expression). -EnableExit → rc=findings.
ps1 = { shell = "cd .. && pwsh -NoProfile -Command \"Invoke-ScriptAnalyzer -Path install -Recurse -ExcludeRule PSAvoidUsingWriteHost,PSUseBOMForUnicodeEncodedFile -EnableExit\"" }

# Run the whole advisory tier at once (nightly / pre-release / agent-triage — not the push gate).
hygiene = ["deadcode", "dup"]

all = ["lint", "types", "arch", "invariants", "complexity", "test-ft", "cov", "deps", "spell", "links"]

# Pre-release gate — the slower must-pass superset run before tagging (`release.py` gates on this, not
# `all`). Re-adds the supply-chain + installer checks pulled from the fast PR loop (audit/licenses/shell —
# rarely relevant to a code PR, release-critical to verify once) plus the checks too slow/heavy for it:
# network link integrity, the real-mpv smoke, and a bench-runs smoke. Needs mpv + network; NOT for PR
# iteration. The human-triage advisory tools (hygiene/ps1/perf-risk) stay OUT — deterministic pass/fail
# only; run those by hand and triage.
pre-release = ["all", "audit", "licenses", "shell", "links-net", "smoke-live", "bench"]
