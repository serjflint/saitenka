id: reader-thread-no-sleep
language: python
severity: error
message: >-
  No time.sleep() in the mpv reader thread (_read_loop/_feed) — it must block only on transport.read().
  A sleep here is the latency/deadlock class that killed hover/mining/quit on Windows; pace in the controller.
note: mpvio/ipc.py — the single-threaded pump() this replaced was the original Windows bug.
files:
  - "src/overlay/mpvio/**/*.py"
rule:
  pattern: time.sleep($$$)
  inside:
    kind: function_definition
    stopBy: end
    has:
      field: name
      regex: "^(_read_loop|_feed)$"
