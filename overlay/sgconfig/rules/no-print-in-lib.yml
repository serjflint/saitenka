id: no-print-in-lib
language: python
severity: warning
message: >-
  No print() in library code — bypasses logsetup.py's secret/path scrubbing. Use log.info()/log.debug().
  print() is fine only in the CLI surface + wizards (user-facing stdout).
note: app/logsetup.py — structlog processors redact secrets/paths from every record.
files:
  - "src/overlay/**/*.py"
# Allowed print() surfaces: CLI entrypoint, user-invoked subcommands (doctor/import), and pre-logging
# bootstrap (reader_deps, crashlog). Core runtime must log.
ignores:
  - "src/overlay/app/cli.py"
  - "src/overlay/app/profile_cli.py"
  - "src/overlay/app/*wizard*.py"
  - "src/overlay/app/doctor.py"
  - "src/overlay/app/yomitan_import.py"
  - "src/overlay/app/reader_deps.py"
  - "src/overlay/app/crashlog.py"
rule:
  pattern: print($$$)
