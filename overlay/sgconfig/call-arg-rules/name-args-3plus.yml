id: name-args-3plus
language: python
severity: warning
message: >-
  Call passes 3+ unnamed positional args — name them (repo convention). Keyword-only params are
  already exempt (can't be passed positionally); this only fires on the leading positional run.
note: >-
  #216's `max-args=8` ratchets the definition side; ruff has no call-site equivalent (PLR0913/PLR0917
  bound the signature, not the call). `*args`/`**kwargs` forwarding and already-keyword args don't
  count. `range`/`slice`/`getattr`/`setattr` are exempt — CPython rejects keyword args for them
  entirely, so there's nothing to name. `log.*`/`logger.*` calls are exempt too — the positional args
  after the message are %-style interpolation slots (logsetup.py), not independently named values.
files:
  - "src/overlay/**/*.py"
rule:
  any:
    - pattern: $FUNC($A, $B, $C)
    - pattern: $FUNC($A, $B, $C, $$$REST)
constraints:
  FUNC:
    not:
      any:
        - regex: "^(range|slice|getattr|setattr)$"
        - regex: "^(log|logger)\\.(debug|info|warning|error|exception|critical)$"
  A:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
  B:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
  C:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
