id: test-session-mutable-fixture
language: python
severity: warning
message: >-
  A session/module-scoped fixture returning a literal mutable ({}/[]/set()) is shared mutable state — a
  cross-test-pollution and free-threading data-race hazard. Use function scope, or reset/yield per test.
note: Axis 2 (Conformance) → the "function scope only" invariant (no scope=session|module mutable state).
files:
  - "tests/**/*.py"
rule:
  kind: decorated_definition
  all:
    - has:
        kind: decorator
        regex: "fixture\\([^)]*scope\\s*=\\s*[\"'](session|module)[\"']"
    - has:
        stopBy: end
        any:
          - pattern: "return {}"
          - pattern: "return []"
          - pattern: "return set()"
          - pattern: "yield {}"
          - pattern: "yield []"
          - pattern: "yield set()"
