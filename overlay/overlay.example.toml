# Saitenka overlay settings — copy to ~/.config/saitenka/overlay.toml (or point --config / $SAITENKA_CONFIG
# elsewhere). Precedence: built-in default < this file < explicit CLI flag.
#
# HOW TO READ THIS FILE (sshd_config style):
#   • Every recognized key appears below, shown at its BUILT-IN DEFAULT.
#   • Commented (#) lines are those defaults — uncomment only to CHANGE one. The commonly-edited keys
#     (dictionaries, decks, jimaku) are left active as a starting point.
#   • Flat `key = value` lines are TOP-LEVEL and must sit ABOVE the first [table] header. Grouped keys
#     live under their [table] ([mine], [known], [fsrs], [palette], [anki], [jimaku], [telemetry], [dictdb]). TOML rule:
#     once a [table] header appears, every later key belongs to it — so keep all flat keys at the top.
#
# Dictionaries are imported ONCE into a consolidated DB (~/.local/share/saitenka/dictionaries.sqlite) by
# `saitenka import <dir-with-zips>`; the lists below are dictionary TITLES resolved against that
# DB (not file paths). Run `saitenka doctor` to see what's imported and `import` to fill them in.

# ── Subtitles & languages ────────────────────────────────────────────────────────────────────────
# slang = "ja,jpn,jp"        # primary (Japanese) subtitle languages, priority order

# ── Tooltip geometry & feel ──────────────────────────────────────────────────────────────────────
# tip_height = 0.4           # BASE tooltip max height as a fraction of the video height
# nested_max_frac = 0.6      # nested (scan) popup max height fraction — deliberately roomier
# show_dict_tabs = false     # sticky per-dictionary tab strip on the base tooltip
# hide_delay = 0.6           # seconds the tooltip lingers after the cursor leaves the word
# flash_secs = 0.22          # duration of the "copied" highlight pulse on a popup
# hover_switch_delay = 0.15  # dwell before the tooltip switches to a NEW word
# scan_delay = 0.25          # dwell before a nested (scan) popup opens; scrolling resets this timer too
# panel_cache_max = 128      # LRU cap on cached (compressed) rendered tooltip panels
# pause_on_tooltip = true    # freeze the frame while a tooltip is shown (the mining default)
# hover_pause_key = "Alt+p"  # toggle hover auto-pause for the current session
# subtitle_language_key = "Alt+t"  # switch the primary subtitle between Japanese and English
# bookmark_key = "Alt+b"  # toggle the active cue in the persistent deferred-capture backlog
# sidebar_key = "\\"  # toggle the whole-track subtitle and deferred-capture sidebar
# analysis_key = "`"  # toggle whole-track Japanese subtitle analysis
# annotation_key = "Alt+a"  # toggle full and hover-only learning annotations
# help_key = "F1"  # toggle the compact in-player shortcut reference
# subtitle_retry_key = "Ctrl+Shift+T"  # retry enabled Japanese subtitle providers
# annotation_mode = "full"  # "full" (default) or neutral until the subtitle is hovered
# banded = true              # experimental windowed (O(viewport)) tooltip renderer; SAITENKA_BANDED=1 also enables it

# ── Translation ──────────────────────────────────────────────────────────────────────────────────
# translate_key = "t"        # mpv key to toggle the official EN translation
# auto_translate = false     # reveal the EN automatically while a tooltip is open (anti-crutch: only then)

# ── Subtitle navigation keys ─────────────────────────────────────────────────────────────────────
# sub_prev_key   = "Alt+LEFT"    # jump to the PREVIOUS subtitle line (sub-seek -1)
# sub_next_key   = "Alt+RIGHT"   # jump to the NEXT subtitle line (sub-seek  1)
# sub_replay_key = "Alt+DOWN"    # replay the CURRENT subtitle line from its start (sub-seek 0)
# Sub-delay nudges z / Z / x are mpv defaults, passed through by our keybinds.

# ── Background work (prefetch & polling) ─────────────────────────────────────────────────────────
# prefetch = true            # warm the current line's tooltips on idle CPU so the first hover is instant
# prefetch_workers = 0       # tooltip-warming worker threads. 0 = auto (4 free-threaded, 2 on GIL). Each
#                            # is persistent + holds ~cache_size_kib of SQLite cache + font faces, so it's
#                            # mainly a RAM knob: set a positive number to pin/cap it.
# prefetch_lookahead = 0     # ALSO warm this many UPCOMING cues (dict-only decode) so the first hover
#                            # after the line advances / an Alt+→ is already decoded. Needs an external
#                            # sub index (embedded/jimaku tracks have none → no-op). Try 1–3. Cheap —
#                            # this is dictionary preload only, no rendering; see head_prefetch_lookahead
#                            # below for the (separate, pricier) tooltip pre-render knob.
# head_prefetch_lookahead = 0  # EXPERIMENTAL, off by default — ALSO speculatively pre-RENDER (not just
#                            # decode) a selective subset of upcoming words (n+1 / rare-frequency,
#                            # excluding already-known/-mined) so more first-hovers land upload-only
#                            # instead of paying render cost on top of an idle-decoded entry. Deliberately
#                            # a separate, shallower knob than prefetch_lookahead — render jobs cost far
#                            # more than decode-only ones. Known tradeoff: real memory cost under
#                            # sustained use, more pronounced on free-threaded builds — not yet
#                            # recommended for a normal session; try 1 if you want to experiment.
# head_prefetch_queue_max = 24 # caps in-flight speculative render jobs (the transient-memory bound for
#                            # head_prefetch_lookahead above — irrelevant while it's 0)
# poll_interval = 0.025      # main-loop tick (s) — trades CPU against input latency
# no_audio_play = false      # set true to NOT auto-play the sentence audio on mine

# ── Mining feel ──────────────────────────────────────────────────────────────────────────────────
# max_bulk = 12              # cap on words mined in one "mine all" (Shift+m) action
# anki_ok_ttl = 3.0          # seconds an AnkiConnect reachability check is cached
# anki_ping_timeout = 0.4    # timeout (s) for that reachability ping (hot hover path)

# ── mpv coexistence ──────────────────────────────────────────────────────────────────────────────
# mpv_path = "/Applications/mpv.app/Contents/MacOS/mpv"  # override mpv auto-discovery
# mpv_socket = "/tmp/mpv-socket"   # socket for `attach` (share with mpv.net/animecards — many clients OK)
# overlay_id_base = 1        # shift our OSD overlay ids (we use 6 from here) if another script owns 1..6
# resync_timeout = 300       # timeout (s) for the jimaku sub-resync subprocess (alass/ffsubsync)

# ── Dictionaries (TITLES, not paths — see the header) ────────────────────────────────────────────
# Definition dictionaries, in tooltip order (first = top). The tooltip scrolls; add as many as you like.
dicts = [
  "Bilingual Dict",
  "Monolingual Dict A",
  "Monolingual Dict B",
]

# Frequency dictionaries → green pills (order preserved; harmonic-blended).
freq = [
  "Frequency General",
  "Frequency Media",
  "Frequency Novels",
]

# Pitch-accent dictionaries → purple pills.
pitch = [
  "Pitch Accent",
]

# ── [known] Known-word source for FSRS-aware coloring: Anki decks → fields (read via AnkiConnect) ──
[known]
"Saitenka::Known" = ["Expression"]

# ── [fsrs] Optional maturity state from a COPY of collection.anki2 ───────────────────────────────
# Never point this at Anki's live database. Refresh the copy before starting Saitenka.
# [fsrs]
# collection = "~/path/to/collection-copy.anki2"

# ── [palette] FSRS maturity colors ───────────────────────────────────────────────────────────────
# [palette]
# learning = "#eed49f"
# young = "#8bd5ca"

# ── [mine] One-key mining target ─────────────────────────────────────────────────────────────────
# Mining is ON whenever this table is present (Ctrl+m mines the hovered word). enabled=false keeps the
# config but turns it off (--no-mine does the same for one run). When mining (or Anki-backed coloring)
# is on, Saitenka starts Anki for you if it's closed.
[mine]
enabled = true
deck = "Saitenka::Mining"
model = "Lapis"
key = "Ctrl+m"
all_key = "Shift+m"
preview_key = "p"

# ── [anki] AnkiConnect endpoint — only if you changed its defaults (stock: 127.0.0.1:8765, no key) ──
# [anki]
# url = "http://127.0.0.1:8765"   # or set host/port separately: host = "127.0.0.1", port = 8765
# api_key = "..."                 # only if you set an AnkiConnect apiKey

# ── [jimaku] jimaku.cc subtitle fetch for attach/plugin mode ─────────────────────────────────────
# `attach` first selects an embedded JP track; only when the file has NO Japanese subs does it fetch
# from jimaku (safe to leave on). Key resolution: this `key` > $JIMAKU_API_KEY > OS keyring. On Linux
# Python 3.15+, Secret Service storage requires the `linux-keyring` extra; otherwise `set-jimaku-key`
# falls back to this config. A GUI-launched mpv cannot inherit a shell-only environment variable.
[jimaku]
enabled = true
resync = true       # auto-resync fetched subs to the video (alass/ffsubsync) — recommended
# key = "..."       # last resort — plaintext; Keychain (set-jimaku-key) is preferred
# force = true      # prefer jimaku OVER the embedded JP track (mistimed/wrong baked-in subs)

# ── [tsukihime] keyless Japanese subtitle fallback — OFF by default ─────────────────────────────
# Runs in the background after a Jimaku miss. It loads only a unique release with one Japanese text
# attachment; ambiguous/image-only results leave playback unchanged.
[tsukihime]
enabled = false
# api_base = "https://api.tsukihime.org/v1"
# timeout = 15.0
# result_cap = 10    # 1..100; a truncated search is never auto-selected

# ── [telemetry] Runtime tracing/metrics (OpenTelemetry) — OFF by default ─────────────────────────
# Requires the `telemetry` extra (`saitenka[telemetry]`) even when enabled here. Local-only: a
# Chrome Trace Format file under the cache dir, no backend/gRPC. See RUNNING.md "Telemetry".
# [telemetry]
# enabled = true
# export_dir = "~/custom/telemetry"   # default: <cache dir>/telemetry
# sample_hot_path = 0.0               # [0.0–1.0] fraction of per-tick hit-tests to instrument (0 = never)

# ── [stats] Local immersion-session history — OFF by default ───────────────────────────────────
# Independent of telemetry: snapshots are queued to a local SQLite writer thread.
# `saitenka stats` shows recent sessions; an interrupted process leaves its row incomplete.
# [stats]
# enabled = true
# summary = true                     # print the session summary on close

# ── [dictdb] Per-connection SQLite tuning for the consolidated dictionary DB (advanced) ──────────
# [dictdb]
# mmap_size = 268435456      # 256 MiB mmap window per read connection
# cache_size_kib = 32768     # 32 MiB page cache per read connection
# entry_cache_max = 256      # LRU cap on decoded dictionary entries, per dictionary
# dexie_chunk_size = 10000   # entries per bank file when importing a dexie (5.x) export
