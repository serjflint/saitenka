# Saitenka overlay settings — copy to ~/.config/saitenka/overlay.toml (or point --config / $SAITENKA_CONFIG
# elsewhere). Precedence: built-in default < this file < explicit CLI flag.
#
# HOW TO READ THIS FILE (sshd_config style):
#   • Every recognized key appears below, shown at its BUILT-IN DEFAULT.
#   • Commented (#) lines are those defaults — uncomment only to CHANGE one. The commonly-edited keys
#     (dictionaries, decks, jimaku) are left active as a starting point.
#   • Flat `key = value` lines are TOP-LEVEL and must sit ABOVE the first [table] header. Grouped keys
#     live under their [table] ([mine], [known], [fsrs], [palette], [anki], [jimaku], [telemetry], [dictdb]). TOML rule:
#     once a [table] header appears, every later key belongs to it — so keep all flat keys at the top.
#
# Dictionaries are imported ONCE into a consolidated DB (~/.local/share/saitenka/dictionaries.sqlite) by
# `saitenka import <dir-with-zips>`; the lists below are dictionary TITLES resolved against that
# DB (not file paths). Run `saitenka doctor` to see what's imported and `import` to fill them in.

# ── Subtitles & languages ────────────────────────────────────────────────────────────────────────
# slang = "ja,jpn,jp"        # primary (Japanese) subtitle languages, priority order

# ── Tooltip geometry & feel ──────────────────────────────────────────────────────────────────────
# ui_scale = 1.0             # help, sidebar, and episode-analysis size (0.75–2.0)
# tip_height = 0.4           # BASE tooltip max height as a fraction of the video height
# tip_scale = 0.0            # fixed tooltip crisp render scale (0 = auto from resolution; e.g. 1.5
#                            # renders crisp native glyph masks at 1.5× on any display — a cosmetic
#                            # preference). Match `saitenka prewarm --atlas-scale` to preload the masks
# nested_max_frac = 0.6      # nested (scan) popup max height fraction — deliberately roomier
# show_dict_tabs = false     # sticky per-dictionary tab strip on the base tooltip
# hide_delay = 0.6           # seconds the tooltip lingers after the cursor leaves the word
# flash_secs = 0.22          # duration of the "copied" highlight pulse on a popup
# hover_switch_delay = 0.15  # dwell before the tooltip switches to a NEW word
# scan_delay = 1.0           # dwell before a nested (scan) popup opens; scrolling resets this timer too
# panel_cache_max = 128      # LRU cap on cached (compressed) rendered tooltip panels
# band_cache_max = 128       # LRU cap on retained 256px render bands *per* panel (the layer under
#                            # panel_cache_max). 128 ≈ 32k px kept warm — a scroll-back window well past
#                            # the viewport (a bounded fraction of a worst-case ~87k-px entry), so short
#                            # scrolls back hit the cache; raise for a wider warm window (more RAM)
# raw_band_ceiling_mb = 100  # keep bands uncompressed (skips the ~9→4ms first-scroll-reach decompress)
#                            # until a panel's estimate exceeds this many MB, then compress it (raw is
#                            # ~10× the zlib size, so this caps one giant entry); 0 = always compress
# layout_engine = "default"  # tooltip block-geometry backend: "default" (pure-Python) or "taffy" (the
#                            # optional taffylite Rust flexbox engine — `pip install
#                            # 'saitenka[layout-engine]'`). Byte-identical geometry; "taffy" trades a Rust
#                            # wheel for a mature CSS engine. Missing wheel falls back to "default".
# render_cache = true        # cross-session render cache (#149), OPT-OUT, USED WHEN AVAILABLE: with a
#                            # prebuilt cache a COLD first-ever hover on a pathological word paints DIRECTLY
#                            # from disk (place+decorate+upload, <1ms) then builds the panel after. No
#                            # prebuilt cache → nothing created. Build it: `saitenka prewarm`. false = ignore.
# mask_atlas = true          # persistent glyph mask atlas (#149), OPT-OUT, USED WHEN AVAILABLE: with a
#                            # prebuilt atlas, getmask2 alpha bitmaps load from disk (~half the raster CPU;
#                            # ~150 MB RAM bulk-loaded once in the background) so cache-miss / scroll /
#                            # post-paint builds skip re-rasterising. Built by `saitenka prewarm`. false = off.
# render_cache_max_mb = 2048  # THE size bound: LRU byte ceiling. Each head ≈ 32 KiB; the full ~32k
#                            # popular-word set is ~900 MB, which this 2 GB default holds with headroom
# render_cache_min_height = 512  # eligibility gate (px): keeps the render cache to NON-TRIVIAL panels.
#                            # <512px ≈ 8ms cold (already within budget, not worth a row); 512-1024px ≈
#                            # 18ms, 4096px ≈ 31ms. (Trivial words' glyphs still land in the mask atlas.)
# pause_on_tooltip = true    # freeze the frame while a tooltip is shown (the mining default)
# hover_pause_key = "Alt+p"  # toggle hover auto-pause for the current session
# overlay_toggle_key = "Alt+o"  # hide/show Saitenka; hidden mode restores mpv subtitles and OSD
# subtitle_language_key = "Alt+t"  # switch the primary subtitle between Japanese and English
# bookmark_key = "Alt+b"  # toggle the active cue in the persistent deferred-capture backlog
# sidebar_key = "\\"  # toggle the whole-track subtitle and deferred-capture sidebar
# analysis_key = "`"  # toggle whole-track Japanese subtitle analysis
# annotation_key = "Alt+a"  # toggle full and hover-only learning annotations
# help_key = "F1"  # toggle the compact in-player shortcut reference
# subtitle_retry_key = "Ctrl+Shift+T"  # retry enabled Japanese subtitle providers
# annotation_mode = "full"  # "full" (default) or neutral until the subtitle is hovered
# banded = true              # windowed (O(viewport)) tooltip renderer (default); SAITENKA_BANDED=0/1 overrides

# ── Translation ──────────────────────────────────────────────────────────────────────────────────
# translate_key = "t"        # mpv key to toggle the official EN translation
# auto_translate = false     # reveal the EN automatically while a tooltip is open (anti-crutch: only then)

# ── Subtitle navigation keys ─────────────────────────────────────────────────────────────────────
# sub_prev_key   = "Alt+LEFT"    # jump to the PREVIOUS subtitle line (sub-seek -1)
# sub_next_key   = "Alt+RIGHT"   # jump to the NEXT subtitle line (sub-seek  1)
# sub_replay_key = "Alt+DOWN"    # replay the CURRENT subtitle line from its start (sub-seek 0)
# Sub-delay nudges z / Z / x are mpv defaults, passed through by our keybinds.

# ── Background work (prefetch & polling) ─────────────────────────────────────────────────────────
# prefetch = true            # warm the current line's tooltips on idle CPU so the first hover is instant
# prefetch_workers = 0       # tooltip-warming worker threads. 0 = auto (4 free-threaded, 2 on GIL). Each
#                            # is persistent + holds ~cache_size_kib of SQLite cache + font faces, so it's
#                            # mainly a RAM knob: set a positive number to pin/cap it.
# prefetch_lookahead = 0     # ALSO warm this many UPCOMING cues (dict-only decode) so the first hover
#                            # after the line advances / an Alt+→ is already decoded. Needs an external
#                            # sub index (embedded/jimaku tracks have none → no-op). Try 1–3. Cheap —
#                            # this is dictionary preload only, no rendering; see head_prefetch_lookahead
#                            # below for the (separate, pricier) tooltip pre-render knob.
# head_prefetch_lookahead = 1  # ALSO speculatively pre-RENDER (not just decode) a selective subset of
#                            # upcoming words (n+1 / rare-frequency, excluding already-known/-mined) so
#                            # more first-hovers land upload-only instead of paying render cost on top of
#                            # an idle-decoded entry. Deliberately a separate, shallower knob than
#                            # prefetch_lookahead — render jobs cost far more than decode-only ones, so it
#                            # carries a real memory cost under sustained use (more pronounced on
#                            # free-threaded builds). Set 0 to disable; raise it to look further ahead.
# head_prefetch_queue_max = 24 # caps in-flight speculative render jobs (the transient-memory bound for
#                            # head_prefetch_lookahead above)
# poll_interval = 0.025      # main-loop tick (s) — trades CPU against input latency
# no_audio_play = false      # set true to NOT auto-play the sentence audio on mine

# ── Mining feel ──────────────────────────────────────────────────────────────────────────────────
# max_bulk = 12              # cap on words mined in one "mine all" (Shift+m) action
# anki_ok_ttl = 3.0          # seconds an AnkiConnect reachability check is cached
# anki_ping_timeout = 0.4    # timeout (s) for that reachability ping (hot hover path)

# ── mpv coexistence ──────────────────────────────────────────────────────────────────────────────
# mpv_path = "/Applications/mpv.app/Contents/MacOS/mpv"  # override mpv auto-discovery
# mpv_socket = "/tmp/mpv-socket"   # optional; bare `attach` uses mpv.net's default pipe on Windows
# Windows literal form, if overridden: mpv_socket = '\\.\pipe\mpvsocket'
# overlay_id_base = 1        # shift our OSD overlay ids (we use 6 from here) if another script owns 1..6
# resync_timeout = 300       # timeout (s) for the jimaku sub-resync subprocess (alass/ffsubsync)

# ── Dictionaries (TITLES, not paths — see the header) ────────────────────────────────────────────
# Definition dictionaries, in tooltip order (first = top). The tooltip scrolls; add as many as you like.
dicts = [
  "Bilingual Dict",
  "Monolingual Dict A",
  "Monolingual Dict B",
]

# Frequency dictionaries → green pills (order preserved; harmonic-blended).
freq = [
  "Frequency General",
  "Frequency Media",
  "Frequency Novels",
]

# Pitch-accent dictionaries → purple pills.
pitch = [
  "Pitch Accent",
]

# ── [known] Known-word source for FSRS-aware coloring: Anki decks → fields (read via AnkiConnect) ──
[known]
"Saitenka::Known" = ["Expression"]

# ── [fsrs] Optional maturity state from a COPY of collection.anki2 ───────────────────────────────
# Never point this at Anki's live database. Refresh the copy before starting Saitenka.
# [fsrs]
# collection = "~/path/to/collection-copy.anki2"

# ── [palette] FSRS maturity colors ───────────────────────────────────────────────────────────────
# [palette]
# learning = "#eed49f"
# young = "#8bd5ca"

# ── [mine] One-key mining target ─────────────────────────────────────────────────────────────────
# Mining is ON whenever this table is present (Ctrl+m mines the hovered word). enabled=false keeps the
# config but turns it off (--no-mine does the same for one run). When mining (or Anki-backed coloring)
# is on, Saitenka starts Anki for you if it's closed.
[mine]
enabled = true
deck = "Saitenka::Mining"
model = "Lapis"                # your Anki note type (must already exist — a deck is auto-created, a
                              # note type is not); `saitenka doctor` warns if its fields don't match
# preset = "Lapis"            # "Lapis" or "Kiku": fill the field map + card_kind for a known note
                              # type so you don't spell `fields` out (Kiku shares Lapis's field names)
# card_kind = "word-and-sentence"  # which card template the mine marks:
                              # word-and-sentence (Lapis/Kiku default) · sentence (the old Saitenka
                              # marker) · audio · click · none. Sets exactly one Is…Card flag.
# [mine.fields]              # override the logical→real field map for a non-Lapis note type, e.g.
# expression = "Word"        #   Animecards: expression→Word, reading→Reading. Only mapped fields are
# reading = "Reading"        #   written; `saitenka doctor` warns about names the note type lacks.
# [mine.card_format]         # Yomitan-style: each note FIELD is a template of {markers}. WINS over
# Word     = "{expression}"  #   [mine.fields] when set. One field can combine markers / one marker can
# Reading  = "{furigana}"    #   fill several fields. Markers: expression reading furigana glossary(+-plain)
# Sentence = "{cloze-prefix}<b>{cloze-body}</b>{cloze-suffix}"   # sentence cloze-prefix/body/suffix
# Pitch    = "{pitch-accents}"  # frequencies frequency-rank pitch-accents pitch-accent-positions
# Image    = "{screenshot}"     # screenshot sentence-audio part-of-speech document-title misc ent-seq tags
key = "Ctrl+m"
all_key = "Shift+m"
preview_key = "p"
# preview = true              # set false to skip the card-preview panel after a mine (a toast
                              # confirms instead; Ctrl+m/Shift+m still mine, ⊕→✓ still flips)
# normalize_audio = false     # even out card volume: −23 LUFS EBU R128 loudnorm on the mined clip
                              # (adds one ffmpeg pass per mine)
# video_key = "Ctrl+Shift+m"  # shortcut: mine the hovered word with an animated (motion) clip, even
                              # when animated_screenshot below is off (a one-shot "record this scene")
# animated_screenshot = false # capture a short animated clip of the scene as the card image instead of a
                              # still (opt-in: larger media + an extra ffmpeg pass). Prefers WebP (small,
                              # sharp) and falls back to GIF where ffmpeg lacks libwebp — GIF is native to
                              # every ffmpeg, so it works out of the box; `saitenka doctor` shows which
# animated_format = "webp"    # "webp" (prefer WebP → GIF) or "gif" (force the universal GIF)
# animated_height = 480       # clip height in px — the main quality↔storage lever (smaller = smaller file)
# animated_fps = 12           # clip frame rate
# animated_quality = 75       # WebP quality, 0–100 (ignored for GIF)
# animated_max_secs = 4.0     # cap clip length so a long cue can't produce a huge file
# word_audio_enabled = false  # attach word-pronunciation audio from a local yomichan/yomitan audio
                              # pack (#93, offline/grounded) — ADDITIVE to the mined scene clip above,
                              # keyed on the expression + reading mining already resolved. No network
                              # fallback (JPod101/TTS) — not grounded, so not adopted.
# word_audio_pack_dir = "~/audio-packs/nhk16"  # pack directory (has an index.json); blank = disabled
# word_audio_field = "WordAudio"  # note field the resolved [sound:...] tag is written to (must exist
                              # on the note type — `saitenka doctor`/mining validation drops it if not)

# ── [anki] AnkiConnect endpoint — only if you changed its defaults (stock: 127.0.0.1:8765, no key) ──
# [anki]
# url = "http://127.0.0.1:8765"   # or set host/port separately: host = "127.0.0.1", port = 8765
# api_key = "..."                 # only if you set an AnkiConnect apiKey
# executable = "C:/portable/Anki/anki.exe"  # optional Windows custom/portable install

# ── [jimaku] jimaku.cc subtitle fetch for attach/plugin mode ─────────────────────────────────────
# `attach` first selects an embedded JP track; only when the file has NO Japanese subs does it fetch
# from jimaku (safe to leave on). Key resolution: this `key` > $JIMAKU_API_KEY > OS keyring. On Linux
# Python 3.15+, Secret Service storage requires the `linux-keyring` extra; otherwise `set-jimaku-key`
# uses an owner-only `jimaku.key` beside this config. GUI mpv cannot inherit a shell-only env variable.
[jimaku]
enabled = true
resync = true       # auto-resync fetched subs to the video (alass/ffsubsync) — recommended
# key = "..."       # last resort — plaintext; Keychain (set-jimaku-key) is preferred
# force = true      # prefer jimaku OVER the embedded JP track (mistimed/wrong baked-in subs)

# ── [tsukihime] keyless Japanese subtitle fallback — OFF by default ─────────────────────────────
# Runs in the background after a Jimaku miss. It loads only a unique release with one Japanese text
# attachment; ambiguous/image-only results leave playback unchanged.
[tsukihime]
enabled = false
# api_base = "https://api.tsukihime.org/v1"
# timeout = 15.0
# result_cap = 10    # 1..100; a truncated search is never auto-selected

# ── [telemetry] Runtime tracing/metrics (OpenTelemetry) — OFF by default ─────────────────────────
# Requires the `telemetry` extra (`saitenka[telemetry]`) even when enabled here. Local-only: a
# Chrome Trace Format file under the cache dir, no backend/gRPC. See the Development docs (Telemetry).
# [telemetry]
# enabled = true
# export_dir = "~/custom/telemetry"   # default: <cache dir>/telemetry
# sample_hot_path = 0.0               # [0.0–1.0] fraction of per-tick hit-tests to instrument (0 = never)

# ── [stats] Local immersion-session history — OFF by default ───────────────────────────────────
# Independent of telemetry: snapshots are queued to a local SQLite writer thread.
# `saitenka stats` shows recent sessions; an interrupted process leaves its row incomplete.
# [stats]
# enabled = true
# summary = true                     # print the session summary on close

# ── [watch] Playback continuity — OFF by default ───────────────────────────────────────────────
# When on, finishing an episode auto-advances to the next sibling in the same folder (SxxExx / NxNN /
# bare-number names) in the SAME mpv window — subtitles, index and stats re-slot in place. A missing or
# ambiguous next file just holds the last frame. Only applies to `saitenka run` (which owns playback);
# `attach`/SyncPlay sessions never auto-advance.
# [watch]
# auto_advance = true

# ── [dictdb] Per-connection SQLite tuning for the consolidated dictionary DB (advanced) ──────────
# [dictdb]
# mmap_size = 268435456      # 256 MiB mmap window per read connection
# cache_size_kib = 32768     # 32 MiB page cache per read connection
# entry_cache_max = 256      # LRU cap on decoded dictionary entries, per dictionary
# dexie_chunk_size = 10000   # entries per bank file when importing a dexie (5.x) export
# persist_seq = false        # persist each term's Yomitan `seq` (opt-in, extra storage) — for a
#                            # JMdict-derived dict (JMdict itself, Jitendex, …) this is the Kanji Study
#                            # deep-link id, so mining can fill it offline without the `jmdict` extra.
#                            # Re-import a dict after turning this on to populate `seq` on its entries.
