# ast-grep test-code lint (`poe test-lint`) — the sharpen loop's Conformance instrument
# (.agents/sharpen/SPEC.md, Axis 2). SEPARATE from sgconfig.yml/`poe invariants` on purpose: these
# rules scan tests/, are advisory (all `warning` → never fail a gate), and are NOT in `poe all`. They
# measure test↔implementation coupling. A rule that reaches ZERO violations graduates to the ERROR gate
# (sgconfig-tests-gate.yml, `poe test-lint-gate`, in `all`) — env-mutation + session-mutable-fixture
# already did. Planted +/- tests (`poe test-lint-test`) keep a rule from rotting into a no-op.
ruleDirs:
  - sgconfig/test-rules
testConfigs:
  - testDir: sgconfig/test-rule-tests
