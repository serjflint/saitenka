# Repo-root task runner. This is NOT a package (`package = false`) — it ships nothing. Its only job is
# to let `uv run poe <task>` work from the repo root by delegating into `overlay/`, where the real poe
# tasks (lint, types, tests, bench, …) live. The dev gate itself is unchanged; this just removes the
# "cd overlay first" papercut. Everything stays in poe — no second task runner.
#
#   uv run poe all          # full dev gate (lint + types + tests + free-threaded + coverage)
#   uv run poe test         # tests only
#   uv run poe smoke-live   # L3 real-mpv smoke (needs a display)
[project]
name = "saitenka-tasks"
version = "0"
requires-python = ">=3.13"

[tool.uv]
package = false
# Store this (poe-only) env in uv's managed cache with a lightweight `.venv` symlink, matching
# overlay/. Keeps the tree free of heavy in-tree venv dirs. See overlay/pyproject.toml [tool.uv].
preview-features = ["centralized-project-envs"]

[dependency-groups]
dev = ["poethepoet>=0.30"]

[tool.poe.tasks]
all = { cmd = "uv run poe all", cwd = "overlay" }
lint = { cmd = "uv run poe lint", cwd = "overlay" }
types = { cmd = "uv run poe types", cwd = "overlay" }
arch = { cmd = "uv run poe arch", cwd = "overlay" }
arch-report = { cmd = "uv run poe arch-report", cwd = "overlay" }
invariants = { cmd = "uv run poe invariants", cwd = "overlay" }
invariants-test = { cmd = "uv run poe invariants-test", cwd = "overlay" }
invariants-taint = { cmd = "uv run poe invariants-taint", cwd = "overlay" }
mutate = { cmd = "uv run poe mutate", cwd = "overlay" }
fuzz = { cmd = "uv run poe fuzz", cwd = "overlay" }
crosshair = { cmd = "uv run poe crosshair", cwd = "overlay" }
complexity = { cmd = "uv run poe complexity", cwd = "overlay" }
complexity-baseline = { cmd = "uv run poe complexity-baseline", cwd = "overlay" }
test = { cmd = "uv run poe test", cwd = "overlay" }
test-ft = { cmd = "uv run poe test-ft", cwd = "overlay" }
affected = { cmd = "uv run poe affected", cwd = "overlay" }
cov = { cmd = "uv run poe cov", cwd = "overlay" }
bench = { cmd = "uv run poe bench", cwd = "overlay" }
smoke-live = { cmd = "uv run poe smoke-live", cwd = "overlay" }
changelog = { cmd = "uv run poe changelog", cwd = "overlay" }
docs = { cmd = "uv run poe docs", cwd = "overlay" }
docs-serve = { cmd = "uv run poe docs-serve", cwd = "overlay" }
docs-cli = { cmd = "uv run poe docs-cli", cwd = "overlay" }
pages = { cmd = "uv run poe pages", cwd = "overlay" }
release-prepare = { cmd = "uv run poe release-prepare", cwd = "overlay" }
release-publish = { cmd = "uv run poe release-publish", cwd = "overlay" }
# Supply-chain & hygiene (real tasks + rationale live in overlay/pyproject.toml).
audit = { cmd = "uv run poe audit", cwd = "overlay" }
pip-audit = { cmd = "uv run poe pip-audit", cwd = "overlay" }
spell = { cmd = "uv run poe spell", cwd = "overlay" }
links = { cmd = "uv run poe links", cwd = "overlay" }
links-net = { cmd = "uv run poe links-net", cwd = "overlay" }
deps = { cmd = "uv run poe deps", cwd = "overlay" }
licenses = { cmd = "uv run poe licenses", cwd = "overlay" }
deadcode = { cmd = "uv run poe deadcode", cwd = "overlay" }
dup = { cmd = "uv run poe dup", cwd = "overlay" }
perf-risk = { cmd = "uv run poe perf-risk", cwd = "overlay" }
shell = { cmd = "uv run poe shell", cwd = "overlay" }
ps1 = { cmd = "uv run poe ps1", cwd = "overlay" }
hygiene = { cmd = "uv run poe hygiene", cwd = "overlay" }
