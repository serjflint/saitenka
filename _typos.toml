# Spell-check allowlist for `poe spell` (typos, run repo-wide from here). Config lives at the repo root,
# not in overlay/pyproject.toml, because the scan covers the whole repo (overlay + deinflect + docs) and
# typos resolves config from the scan root. These are intentional/valid tokens, not corrections to make.
[default.extend-words]
unparseable = "unparseable"   # valid variant of "unparsable"; used in our error strings
entrie = "entrie"             # deliberate `entrie(s)` pluralisation in CLI output
mis = "mis"                   # appears in compounds/prefixes, not a standalone typo
certifi = "certifi"           # the package name, not "certify"
PN = "PN"                     # proper-noun pos tag / notation, not "ON"
Hime = "Hime"                 # TsukiHime — a subtitle source's proper name, not "Him"
