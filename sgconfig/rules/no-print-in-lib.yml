id: no-print-in-lib
language: python
severity: warning
message: >-
  No print() in library code — bypasses logsetup.py's secret/path scrubbing. Use log.info()/log.debug().
  print() is fine only in the CLI surface + wizards (user-facing stdout).
note: app/logsetup.py — structlog processors redact secrets/paths from every record.
files:
  - "src/saitenka/**/*.py"
# Allowed print() surfaces: the CLI entrypoint and the subcommand packages it composes, the interactive
# wizards/prompts, the pre-logging bootstrap (reader_deps, crashlog), and `console.py` — the runtime's
# one sanctioned stdout line. Everything else must log.
# Kept in step with pyproject's `[tool.ruff.lint.per-file-ignores]` "print" entries — that list is the
# SSOT and `tests/test_print_surface_allowlist.py` fails when the two drift. A deliberate site inside a
# non-CLI module goes through `console.announce`, not a widening of this list.
ignores:
  - "src/saitenka/app/cli.py"
  - "src/saitenka/app/console.py"
  - "src/saitenka/app/commands/*.py"
  - "src/saitenka/app/launch/run.py"
  - "src/saitenka/app/config_editor.py"
  - "src/saitenka/app/profile_cli.py"
  - "src/saitenka/app/*wizard*.py"
  - "src/saitenka/app/prompt.py"
  - "src/saitenka/app/doctor.py"
  - "src/saitenka/app/yomitan_import.py"
  - "src/saitenka/app/reader_deps.py"
  - "src/saitenka/app/crashlog.py"
rule:
  pattern: print($$$)
