id: subprocess-utf8-encoding
valid:
  # text mode WITH an explicit utf-8 encoding — the fixed form
  - subprocess.run(cmd, capture_output=True, text=True, encoding="utf-8", timeout=10)
  # bytes mode (no text=/universal_newlines=) never touches a codec — safe
  - subprocess.run(cmd, capture_output=True, timeout=60)
  - subprocess.Popen(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
  # multi-line text call with encoding present
  - |
    subprocess.run(
        [ffprobe, "-of", "json", str(video)],
        capture_output=True,
        text=True,
        encoding="utf-8",
        check=False,
    )
invalid:
  # text=True, no encoding — the friend's cp932 ffprobe-decode bug class
  - subprocess.run(cmd, capture_output=True, text=True, timeout=10, check=False)
  # legacy spelling
  - subprocess.check_output(cmd, universal_newlines=True)
  # multi-line, own-line text=True with no encoding
  - |
    subprocess.run(
        [ffprobe, "-of", "json", str(video)],
        capture_output=True,
        text=True,
        check=False,
    )
